<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Netzschwinger – Schwing dich durch die Stadt</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef1f6;--fg:#14161c;--panel:rgba(255,255,255,.96);--border:rgba(0,0,0,.18);
  --hud:rgba(255,255,255,.82);--hudfg:#101218;--accent:#d32f2f;--btn:#e4e8f0;color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0d1017;--fg:#eef0f6;--panel:rgba(22,26,37,.96);--border:rgba(255,255,255,.2);
    --hud:rgba(14,17,26,.72);--hudfg:#eef0f6;--btn:#2a3042;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1017;--fg:#eef0f6;--panel:rgba(22,26,37,.96);--border:rgba(255,255,255,.2);
  --hud:rgba(14,17,26,.72);--hudfg:#eef0f6;--btn:#2a3042;color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;overflow:hidden}
body{height:100%;position:relative;background:var(--bg);color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button,select,input{font:inherit}
button{background:var(--btn);color:var(--fg);border:1px solid var(--border);border-radius:12px;
  min-height:44px;padding:.4rem .9rem;cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:transparent;font-weight:700}
#hud{position:absolute;inset:0;pointer-events:none}
#stats{position:absolute;top:10px;left:10px;max-width:calc(100vw - 80px);overflow:hidden;background:var(--hud);color:var(--hudfg);
  padding:.35rem .85rem;border-radius:999px;font-size:.85rem;white-space:nowrap}
#mini{position:absolute;left:10px;top:66px;width:104px;height:104px;border-radius:50%;
  background:var(--hud);border:2px solid var(--border)}
#cross{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;
  border:2px solid rgba(255,255,255,.85);box-shadow:0 0 3px rgba(0,0,0,.6)}
body.vr #cross{display:none}
#toast{position:absolute;left:50%;top:20%;transform:translateX(-50%);background:var(--hud);color:var(--hudfg);
  padding:.5rem 1rem;border-radius:12px;font-size:.95rem;opacity:0;transition:opacity .25s;max-width:86vw;text-align:center}
#gear{position:absolute;right:10px;top:8px;width:46px;height:46px;border-radius:50%;font-size:1.3rem;
  padding:0;pointer-events:auto;z-index:5}
#debug{position:absolute;left:10px;top:214px;width:min(330px,72vw);background:var(--hud);color:var(--hudfg);
  border-radius:10px;padding:.5rem;font-size:.72rem;pointer-events:auto}
#debug[hidden]{display:none}
#debug .row{display:flex;flex-wrap:wrap;gap:.3rem;margin:.4rem 0}
#debug button{min-height:36px;padding:.2rem .5rem;font-size:.75rem}
#dbgInfo,#dbgLog{white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;margin:0}
#dbgLog{opacity:.8;max-height:6.5em;overflow:hidden}
#touch{display:none;position:absolute;inset:0;pointer-events:none}
body.touch #touch{display:block}
body.vr #touch,body.vr #hud>*:not(#toast){display:none}
#joy{position:absolute;left:16px;bottom:22px;width:150px;height:150px;border-radius:50%;
  background:var(--hud);border:2px solid var(--border);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;border-radius:50%;
  background:var(--accent);opacity:.85;transform:translate(-50%,-50%)}
.act{position:absolute;border-radius:50%;pointer-events:auto;touch-action:none;font-weight:700;
  font-size:.72rem;padding:0;display:flex;align-items:center;justify-content:center;
  background:var(--hud);color:var(--hudfg);border:2px solid var(--border)}
#bWeb{right:16px;bottom:26px;width:104px;height:104px;background:var(--accent);color:#fff;font-size:.95rem}
#bJump{right:134px;bottom:26px;width:76px;height:76px}
#bReel{right:26px;bottom:144px;width:76px;height:76px}
.act:active,.act.on{filter:brightness(1.25);transform:scale(.96)}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10;
  background:rgba(8,10,16,.62);padding:12px;box-sizing:border-box}
.overlay[hidden]{display:none}
.card{background:var(--panel);color:var(--fg);border:1px solid var(--border);border-radius:18px;
  padding:1.1rem 1.2rem;width:min(460px,94vw);max-height:88vh;overflow:auto;touch-action:pan-y;
  box-sizing:border-box}
.card h1{margin:.1rem 0 .4rem;font-size:1.6rem}
.card h2{margin:.1rem 0 .6rem;font-size:1.2rem}
.card p{margin:.4rem 0;line-height:1.4;font-size:.92rem}
.hint{opacity:.8;font-size:.82rem!important}
.btns{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.8rem}
.btns button{flex:1 1 140px}
.set{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.55rem 0;
  border-bottom:1px solid var(--border)}
.set label{flex:1}
.set input[type=range]{flex:1.2;min-width:0;height:32px}
.set select{min-height:40px;border-radius:10px;background:var(--btn);color:var(--fg);border:1px solid var(--border)}
.set input[type=checkbox]{width:26px;height:26px}
.val{min-width:3.2em;text-align:right;font-size:.85rem;opacity:.8}
#codeIn{flex:1;min-width:0;min-height:40px;border-radius:10px;border:1px solid var(--border);
  background:var(--btn);color:var(--fg);padding:0 .6rem}
#codeMsg{font-size:.85rem;min-height:1.2em;margin:.3rem 0}
#toast{z-index:20}
#obj{position:absolute;top:44px;left:124px;right:64px;background:var(--hud);color:var(--hudfg);padding:.25rem .6rem;
  border-radius:10px;font-size:.76rem;line-height:1.25}
#hpBar{position:absolute;left:10px;top:48px;width:104px;height:12px;border-radius:6px;background:var(--hud);
  border:2px solid var(--border);overflow:hidden;box-sizing:border-box}
#hpFill{display:block;height:100%;width:100%;background:#e53935;transition:width .15s}
#cds{position:absolute;left:10px;top:176px;display:flex;flex-direction:column;gap:4px}
.cd{background:var(--hud);color:var(--hudfg);border-radius:8px;padding:2px 8px;font-size:.74rem;width:fit-content}
#boss{position:absolute;top:80px;left:124px;right:64px;height:14px;border-radius:7px;background:var(--hud);
  border:2px solid var(--border);overflow:hidden;box-sizing:border-box}
#boss[hidden]{display:none}
#bossFill{display:block;height:100%;width:100%;background:#b43cff}
#hurt{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;
  box-shadow:inset 0 0 90px 22px rgba(255,0,0,.7)}
#bShoot{right:112px;bottom:112px;width:68px;height:68px}
#bDash{left:16px;bottom:184px;width:64px;height:64px}
#bSpin{left:90px;bottom:184px;width:64px;height:64px}
.skins{display:flex;flex-wrap:wrap;gap:.6rem;margin:.5rem 0}
.skinw{display:flex;flex-direction:column;align-items:center;font-size:.7rem;gap:3px}
button.skin{width:44px;height:44px;border-radius:50%;padding:0;min-height:44px;font-size:1rem;border:2px solid var(--border)}
button.skin.sel{outline:3px solid var(--accent);outline-offset:2px}
#cut{position:fixed;inset:0;z-index:9;cursor:pointer}
#cut[hidden]{display:none}
.cbar{position:absolute;left:0;right:0;background:#000;height:12vh}
.ctop{top:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:.6rem;box-sizing:border-box;
  color:#ffd34d;font-weight:700;font-size:1.05rem;text-align:center}
.cbot{bottom:0}
#cutSub{position:absolute;left:50%;bottom:calc(12vh + 14px);transform:translateX(-50%);width:min(760px,92vw);
  background:rgba(0,0,0,.62);color:#fff;padding:.6rem .9rem;border-radius:12px;font-size:1rem;line-height:1.35;
  text-align:left;pointer-events:none;box-sizing:border-box}
#cutWho{color:#ffd34d;margin-right:.5rem}
#cutWho::after{content:':'}
#cutSkip{position:absolute;right:12px;bottom:calc(6vh - 22px);background:rgba(255,255,255,.15);color:#fff;
  border:1px solid rgba(255,255,255,.35);min-height:44px}
body.cut #hud>*:not(#toast),body.cut #touch,body.cut #gear{display:none}
#crime{position:absolute;top:100px;left:124px;right:64px;display:none;background:var(--hud);color:#ff5a5a;
  padding:.25rem .6rem;border-radius:10px;font-size:.76rem;font-weight:700}
.maps{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0}
button.mapcard{flex:1 1 120px;text-align:left;height:auto;border-radius:12px;padding:.5rem .6rem;line-height:1.25}
button.mapcard small{display:block;opacity:.75;font-size:.72rem}
button.mapcard.sel{outline:3px solid var(--accent)}
button.mapcard.lock{opacity:.55}
#uied{position:fixed;inset:0;z-index:12;pointer-events:none}
#uied[hidden]{display:none}
#uiedBanner{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;
  padding:.4rem .9rem;border-radius:999px;font-size:.8rem;max-width:80vw;text-align:center}
#uiedPanel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,90vw);
  background:var(--panel);color:var(--fg);border:1px solid var(--border);border-radius:14px;padding:.6rem .8rem;
  pointer-events:auto;box-sizing:border-box;touch-action:manipulation}
#uiedPanel.top{top:112px;transform:translate(-50%,0)}
#uiedName{font-weight:700;margin-bottom:.2rem}
.uihide{display:none!important}
body.uiedit .uie{pointer-events:auto!important;outline:2px dashed #ffd34d;outline-offset:2px;touch-action:none;cursor:move}
body.uiedit .uie.sel{outline:3px solid #ff4d4d}
body.uiedit .uie.uihide{display:block!important;opacity:.3!important}
body.uiedit #touch{display:block}
body.uiedit #gear{display:block}
body.uiedit #obj,body.uiedit #crime{display:block!important}
body.uiedit #boss[hidden]{display:block!important}
body.uiedit #obj:empty::before{content:'🎯 Ziel / Objective'}
body.uiedit #crime:empty::before{content:'🚨 Verbrechen / Crime'}
body.uiedit #cross{width:26px;height:26px;margin:-13px 0 0 -13px}
#botHud{position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 0 4px rgba(77,255,176,.45),inset 0 0 140px rgba(0,0,0,.45)}
#botHud[hidden]{display:none}
.botrec{position:absolute;top:130px;right:12px;color:#4dffb0;font-weight:700;font-size:.85rem;
  background:rgba(0,0,0,.55);padding:.2rem .7rem;border-radius:8px;letter-spacing:.05em}
.botrec .dot{color:#ff3b3b;animation:botblink 1s infinite}
@keyframes botblink{50%{opacity:.15}}
.bothint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);color:#4dffb0;font-size:.72rem;
  background:rgba(0,0,0,.5);padding:.15rem .6rem;border-radius:8px;white-space:nowrap;max-width:96vw;overflow:hidden}
#bBot{left:164px;bottom:184px;width:64px;height:64px}
#bView{left:238px;bottom:184px;width:52px;height:52px;font-size:1.1rem}
#creaHud{display:none;position:absolute;inset:0;pointer-events:none;z-index:4}
body.creative #creaHud{display:block}
body.vr #creaHud,body.cut #creaHud{display:none}
#cPlace{right:112px;bottom:112px;width:84px;height:84px;background:var(--accent);color:#fff;font-size:.9rem}
#cRemove{left:226px;bottom:184px;width:60px;height:60px}
#cUndo{left:156px;bottom:184px;width:60px;height:60px;font-size:1.3rem}
#cColor{left:86px;bottom:184px;width:60px;height:60px;border:3px solid #fff}
#cMenu{left:16px;bottom:184px;width:60px;height:60px;font-size:1.3rem}
body.creative #bShoot,body.creative #bDash,body.creative #bSpin,body.creative #bBot,body.creative #bView,
body.creative #hpBar,body.creative #cds,body.creative #crime,body.creative #boss,body.creative #botHud,body.creative #mini{display:none!important}
.sizerow{display:flex;align-items:center;gap:.6rem;margin:.3rem 0}
.sizerow span{min-width:4em;text-align:center}
.slotrow{display:flex;align-items:center;gap:.5rem;margin:.3rem 0}
.slotrow span{flex:1;font-size:.85rem}
.slotrow button,.sizerow button{min-height:40px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="stats"></div>
  <canvas id="mini" width="208" height="208"></canvas>
  <div id="cross"></div>
  <div id="toast"></div>
  <div id="obj"></div>
  <div id="hpBar"><i id="hpFill"></i></div>
  <div id="cds"><span class="cd" id="cdDash"></span><span class="cd" id="cdSpin"></span><span class="cd" id="cdBot"></span></div>
  <div id="boss" hidden><i id="bossFill"></i></div>
  <div id="crime"></div>
  <div id="botHud" hidden>
    <div class="botrec"><span class="dot">●</span> <span data-i18n="botRec"></span> <span id="botBat"></span></div>
    <div class="bothint" data-i18n="botHint"></div>
  </div>
  <div id="hurt"></div>
  <div id="debug" hidden>
    <div id="dbgInfo"></div>
    <div class="row">
      <button id="dFly"></button><button id="dFast"></button>
      <button id="dWire"></button><button id="dRestart"></button><button id="dGod"></button><button id="dSpawn"></button><button id="dSkip"></button>
    </div>
    <pre id="dbgLog"></pre>
  </div>
</div>

<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <button class="act" id="bJump" data-i18n="jump"></button>
  <button class="act" id="bReel" data-i18n="reel"></button>
  <button class="act" id="bWeb" data-i18n="web"></button>
  <button class="act" id="bShoot" data-i18n="shoot"></button>
  <button class="act" id="bDash" data-i18n="dash"></button>
  <button class="act" id="bSpin" data-i18n="spin"></button>
  <button class="act" id="bBot" data-i18n="botBtn"></button>
  <button class="act" id="bView">👁</button>
</div>

<div id="creaHud">
  <button class="act" id="cPlace" data-i18n="creaPlace"></button>
  <button class="act" id="cRemove" data-i18n="creaRemove"></button>
  <button class="act" id="cUndo">↶</button>
  <button class="act" id="cColor"></button>
  <button class="act" id="cMenu">🧱</button>
</div>

<button id="gear" aria-label="Settings">⚙️</button>

<div class="overlay" id="start">
  <div class="card">
    <h1 data-i18n="title"></h1>
    <p data-i18n="sub"></p>
    <p class="hint" id="hintMain"></p>
    <p class="hint" data-i18n="hintVR"></p>
    <p class="hint" data-i18n="hintAb"></p>
    <p class="hint" data-i18n="hintCrime"></p>
    <p class="hint" data-i18n="hintBot"></p>
    <div class="maps" id="mapsStart"></div>
    <div class="skins" id="skinsStart"></div>
    <div class="btns">
      <button class="primary" id="btnPlay" data-i18n="start"></button>
      <button id="btnVR" hidden data-i18n="vr"></button>
      <button id="btnStartSet" data-i18n="startSettings"></button>
    </div>
    <p class="hint" id="vrNote"></p>
  </div>
</div>

<div class="overlay" id="menu" hidden>
  <div class="card">
    <h2 data-i18n="settings"></h2>

    <div class="set"><label for="setDark" data-i18n="dark"></label><input type="checkbox" id="setDark"></div>

    <div class="set"><label for="setVol" data-i18n="volume"></label>
      <input type="range" id="setVol" min="0" max="100" step="1"><span class="val" id="volVal"></span></div>
    <div class="set"><label for="setMute" data-i18n="mute"></label><input type="checkbox" id="setMute"></div>

    <div class="set"><label for="setLang" data-i18n="language"></label>
      <select id="setLang"><option value="de">Deutsch</option><option value="en">English</option></select></div>
    <div class="set"><label for="setFont" data-i18n="fontsize"></label>
      <input type="range" id="setFont" min="0" max="2" step="1"><span class="val" id="fontVal"></span></div>

    <div class="set"><label for="setFov" data-i18n="fov"></label>
      <input type="range" id="setFov" min="50" max="120" step="1"><span class="val" id="fovVal"></span></div>
    <div class="set"><label for="setSens" data-i18n="sens"></label>
      <input type="range" id="setSens" min="0.1" max="3" step="0.1"><span class="val" id="sensVal"></span></div>
    <div class="set"><label for="setQ" data-i18n="quality"></label>
      <select id="setQ"><option value="0" data-i18n="q0"></option><option value="1" data-i18n="q1"></option><option value="2" data-i18n="q2"></option></select></div>
    <div class="set"><label for="setInv" data-i18n="invy"></label><input type="checkbox" id="setInv"></div>
    <div class="set"><label for="setCycle" data-i18n="cycle"></label><input type="checkbox" id="setCycle"></div>
    <div class="set"><label for="setHour" data-i18n="hour"></label><input type="range" id="setHour" min="0" max="24" step="0.25"><span class="val" id="hourVal"></span></div>
    <div class="set"><label for="setShader" data-i18n="shader"></label>
      <select id="setShader"><option value="0" data-i18n="sh0"></option><option value="1" data-i18n="sh1"></option><option value="2" data-i18n="sh2"></option><option value="3" data-i18n="sh3"></option><option value="4" data-i18n="sh4"></option></select></div>
    <div class="set"><label for="setBlur" data-i18n="speedblur"></label><input type="checkbox" id="setBlur"></div>
    <div class="set"><label for="setAuto" data-i18n="autoswing"></label><input type="checkbox" id="setAuto"></div>
    <div class="set" style="display:block"><label data-i18n="map"></label><div class="maps" id="mapsMenu"></div></div>
    <div class="set" style="display:block"><label data-i18n="skin"></label><div class="skins" id="skinsMenu"></div></div>

    <div class="set" style="border-bottom:none">
      <input id="codeIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="codeBtn" data-i18n="ok"></button>
    </div>
    <div id="codeMsg"></div>

    <div class="btns">
      <button id="debugOff" hidden data-i18n="debugOff"></button>
      <button id="uiEditBtn" data-i18n="uiedit"></button>
      <button id="resetBtn" data-i18n="reset"></button>
      <button class="primary" id="closeBtn" data-i18n="close"></button>
    </div>
  </div>
</div>

<div class="overlay" id="creaMenu" hidden>
  <div class="card">
    <h2 data-i18n="creaTitle"></h2>
    <div class="set" style="display:block"><label data-i18n="creaColor"></label><div class="skins" id="creaColors"></div></div>
    <div class="set" style="display:block"><label data-i18n="creaSize"></label><div id="creaSizes"></div><div class="btns" id="creaPresets"></div></div>
    <div class="set"><label for="creaSnap" data-i18n="creaSnap"></label>
      <select id="creaSnap"><option value="0.5">0,5 m</option><option value="1">1 m</option><option value="2">2 m</option><option value="5">5 m</option></select></div>
    <div class="set"><label for="creaFly" data-i18n="creaFly"></label><input type="checkbox" id="creaFly"></div>
    <div class="set" style="display:block"><label data-i18n="creaSave"></label><div id="creaSlots"></div></div>
    <div class="btns">
      <button id="creaExport" data-i18n="creaExport"></button>
      <button id="creaClear" data-i18n="creaClear"></button>
      <button class="primary" id="creaClose" data-i18n="close"></button>
    </div>
    <p class="hint" data-i18n="creaKeys"></p>
  </div>
</div>

<div class="overlay" id="creaIO" hidden>
  <div class="card">
    <h2 data-i18n="creaExport"></h2>
    <textarea id="creaText" rows="6" spellcheck="false" style="width:100%;box-sizing:border-box;background:var(--btn);color:var(--fg);border:1px solid var(--border);border-radius:10px;padding:.5rem;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.7rem"></textarea>
    <div class="btns">
      <button id="creaCopy" data-i18n="creaCopy"></button>
      <button id="creaImport" data-i18n="creaImport"></button>
      <button class="primary" id="creaIOClose" data-i18n="close"></button>
    </div>
  </div>
</div>

<div id="uied" hidden>
  <div id="uiedBanner" data-i18n="uiHint"></div>
  <div id="uiedPanel">
    <div id="uiedName"></div>
    <div class="set"><label for="uiSize" data-i18n="uiSize"></label><input type="range" id="uiSize" min="0.5" max="2" step="0.05"></div>
    <div class="set"><label for="uiOp" data-i18n="uiOpacity"></label><input type="range" id="uiOp" min="0.2" max="1" step="0.05"></div>
    <div class="btns">
      <button id="uiHide"></button><button id="uiResetEl" data-i18n="uiResetEl"></button>
      <button id="uiResetAll" data-i18n="uiResetAll"></button><button id="uiMove">⇅</button>
      <button class="primary" id="uiDone" data-i18n="uiDone"></button>
    </div>
  </div>
</div>

<div id="cut" hidden>

function makeBuildingTextures(){
  const s=128, cell=16;
  const c1=document.createElement('canvas'), c2=document.createElement('canvas');
  c1.width=c1.height=c2.width=c2.height=s;
  const g=c1.getContext('2d'), e=c2.getContext('2d');
  g.fillStyle='#c7ccd4'; g.fillRect(0,0,s,s);
  e.fillStyle='#000'; e.fillRect(0,0,s,s);
  for(let i=0;i<8;i++) for(let j=0;j<8;j++){
    const x=i*cell, y=j*cell;
    g.fillStyle='#2b3652'; g.fillRect(x+4,y+4,8,9);
    g.fillStyle='rgba(255,255,255,.2)'; g.fillRect(x+4,y+4,8,2);
    if(rng()<0.45){ e.fillStyle = rng()<0.8 ? '#ffd890' : '#9fd0ff'; e.fillRect(x+4,y+4,8,9); }
  }
  const mk = c => { const tx=new THREE.CanvasTexture(c); tx.wrapS=tx.wrapT=THREE.RepeatWrapping;
    tx.anisotropy=Math.min(4, renderer.capabilities.getMaxAnisotropy()); return tx; };
  return {map:mk(c1), emi:mk(c2)};
}
function makeGroundTexture(){
  const s=256, c=document.createElement('canvas'); c.width=c.height=s;
  const g=c.getContext('2d'); const rw=Math.round(256*11/P); // halbe Straßenbreite in px
  g.fillStyle=MAP.ground.side; g.fillRect(0,0,s,s);
  g.fillStyle=MAP.ground.road;
  g.fillRect(0,0,rw,s); g.fillRect(s-rw,0,rw,s); g.fillRect(0,0,s,rw); g.fillRect(0,s-rw,s,rw);
  g.fillStyle=MAP.ground.curb; // Bordstein
  g.fillRect(rw,rw,3,s-2*rw); g.fillRect(s-rw-3,rw,3,s-2*rw);
  g.fillRect(rw,rw,s-2*rw,3); g.fillRect(rw,s-rw-3,s-2*rw,3);
  g.fillStyle=MAP.ground.line; // Mittellinie
  for(let y=rw+6;y<s-rw-10;y+=26){ g.fillRect(0,y,2,14); g.fillRect(s-2,y,2,14); }
  for(let x=rw+6;x<s-rw-10;x+=26){ g.fillRect(x,0,14,2); g.fillRect(x,s-2,14,2); }
  const tx=new THREE.CanvasTexture(c); tx.wrapS=tx.wrapT=THREE.RepeatWrapping;
  tx.anisotropy=Math.min(8, renderer.capabilities.getMaxAnisotropy()); return tx;
}

let stampCounter = 0;
function gridKey(a,c){ return (a+60)*300 + (c+60); }
function gridAdd(b){
  const c0=Math.floor(b.x0/CELL), c1=Math.floor(b.x1/CELL), d0=Math.floor(b.z0/CELL), d1=Math.floor(b.z1/CELL);
  for(let a=c0;a<=c1;a++) for(let c=d0;c<=d1;c++){
    const k=gridKey(a,c); let arr=grid.get(k); if(!arr){arr=[];grid.set(k,arr);} arr.push(b);
  }
}
function forBoxes(x0,z0,x1,z1,fn){
  stampCounter++;
  const c0=Math.floor(x0/CELL), c1=Math.floor(x1/CELL), d0=Math.floor(z0/CELL), d1=Math.floor(z1/CELL);
  for(let a=c0;a<=c1;a++) for(let c=d0;c<=d1;c++){
    const arr=grid.get(gridKey(a,c)); if(!arr) continue;
    for(let i=0;i<arr.length;i++){ const b=arr[i]; if(b.stamp===stampCounter) continue; b.stamp=stampCounter; fn(b); }
  }
}

const bPos=[], bNor=[], bUv=[], bCol=[], bIdx=[];
function face(c,n,uv,col){
  const base=bPos.length/3;
  for(let k=0;k<4;k++){ bPos.push(c[k][0],c[k][1],c[k][2]); bNor.push(n[0],n[1],n[2]);
    bUv.push(uv[k][0],uv[k][1]); bCol.push(col[0],col[1],col[2]); }
  bIdx.push(base,base+1,base+2, base,base+2,base+3);
}
const TINTS=MAP.tints||TINTS_DEFAULT;
function addBuilding(x0,z0,x1,z1,y0,y1){
  const w=x1-x0, d=z1-z0, h=y1-y0, ws=32;
  const tint=TINTS[(rng()*TINTS.length)|0], br=0.7+rng()*0.4;
  const col=[tint[0]*br,tint[1]*br,tint[2]*br];
  const ou=Math.floor(rng()*8)/8, ov=Math.floor(rng()*8)/8;
  const uvq=(a,b)=>[[ou,ov],[ou+a,ov],[ou+a,ov+b],[ou,ov+b]];
  face([[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]],[0,0,1],uvq(w/ws,h/ws),col);
  face([[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0]],[0,0,-1],uvq(w/ws,h/ws),col);
  face([[x1,y0,z1],[x1,y0,z0],[x1,y1,z0],[x1,y1,z1]],[1,0,0],uvq(d/ws,h/ws),col);
  face([[x0,y0,z0],[x0,y0,z1],[x0,y1,z1],[x0,y1,z0]],[-1,0,0],uvq(d/ws,h/ws),col);
  const rc=[col[0]*0.55,col[1]*0.55,col[2]*0.55], ru=[0.01,0.99];
  face([[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[x0,y1,z0]],[0,1,0],[ru,ru,ru,ru],rc);
  const b={x0,x1,y0,y1,z0,z1,stamp:0};
  buildings.push(b); gridAdd(b);
}

/* ================= Strahl- & Kollisionsfunktionen ================= */
const oa=[0,0,0], da=[0,0,0];
function rayBox(o,d,b,maxT){
  oa[0]=o.x;oa[1]=o.y;oa[2]=o.z; da[0]=d.x;da[1]=d.y;da[2]=d.z;
  const mn=[b.x0,b.y0,b.z0], mx=[b.x1,b.y1,b.z1];
  let t0=0,t1=maxT;
  for(let k=0;k<3;k++){
    if(Math.abs(da[k])<1e-8){ if(oa[k]<mn[k]||oa[k]>mx[k]) return -1; }
    else{
      let a=(mn[k]-oa[k])/da[k], c=(mx[k]-oa[k])/da[k];
      if(a>c){const q=a;a=c;c=q;}
      if(a>t0)t0=a; if(c<t1)t1=c; if(t0>t1) return -1;
    }
  }
  return t0>0?t0:-1;
}
function raycastCity(o,d,maxT){
  const ex=o.x+d.x*maxT, ez=o.z+d.z*maxT;
  let best=Infinity;
  forBoxes(Math.min(o.x,ex)-1,Math.min(o.z,ez)-1,Math.max(o.x,ex)+1,Math.max(o.z,ez)+1,b=>{
    const tt=rayBox(o,d,b,maxT); if(tt>0&&tt<best) best=tt;
  });
  return best;
}
function insideAnyBuilding(x,y,z,m){
  let hit=false;
  forBoxes(x-m,z-m,x+m,z+m,b=>{ if(x>b.x0-m&&x<b.x1+m&&y>b.y0-m&&y<b.y1+m&&z>b.z0-m&&z<b.z1+m) hit=true; });
  return hit;
}

/* ================= Netz-Logik ================= */
function findAnchor(o,d){
  let hl=Math.hypot(d.x,d.z), fx, fz;
  if(hl<0.05){ fx=-Math.sin(heading); fz=-Math.cos(heading); } else { fx=d.x/hl; fz=d.z/hl; }
  const p0=Math.asin(THREE.MathUtils.clamp(d.y,-1,1));
  const base=THREE.MathUtils.clamp(p0,0.35,1.3);
  const deltas=[0,0.2,-0.2,0.4,-0.35];
  for(const dl of deltas){
    const p=THREE.MathUtils.clamp(base+dl,0.25,1.35), cp=Math.cos(p);
    tC.set(fx*cp,Math.sin(p),fz*cp);
    const tt=raycastCity(o,tC,150);
    if(tt<Infinity && tt>8){
      const hy=o.y+tC.y*tt;
      if(hy>o.y+3) return tD.copy(o).addScaledVector(tC,tt).clone();
    }
  }
  return null;
}

}
function tryAttach(announce){

  } else if(announce) toast(t('noTarget'));
}

let ac=null, master=null, windGain=null, windFilt=null;
function initAudio(){
  try{
    if(!ac){
      ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain(); master.connect(ac.destination);
      const buf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate), d=buf.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      const src=ac.createBufferSource(); src.buffer=buf; src.loop=true;
      windFilt=ac.createBiquadFilter(); windFilt.type='lowpass'; windFilt.frequency.value=400;
      windGain=ac.createGain(); windGain.gain.value=0;
      src.connect(windFilt); windFilt.connect(windGain); windGain.connect(master); src.start();
      applyVolume();
    }
    if(ac.state==='suspended') ac.resume();
  }catch(e){ log('Audio: '+e.message); }
}
function applyVolume(){ if(master) master.gain.value=S.mute?0:S.volume/100; }
function thwip(){
  if(!ac) return;
  try{
    const len=Math.floor(ac.sampleRate*0.18), buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2);
    const s=ac.createBufferSource(); s.buffer=buf;
    const f=ac.createBiquadFilter(); f.type='bandpass'; f.Q.value=2;
    f.frequency.setValueAtTime(1500,ac.currentTime); f.frequency.exponentialRampToValueAtTime(5500,ac.currentTime+0.16);
    const g=ac.createGain(); g.gain.value=0.9;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  }catch(e){}
}

let snapCool=0;
function pollInput(dt){
  let mx=0,mz=0,sprint=false;
  // Tastatur
  if(keys.KeyW) mz+=1; if(keys.KeyS) mz-=1; if(keys.KeyD) mx+=1; if(keys.KeyA) mx-=1;
  sprint = !!(keys.ShiftLeft||keys.ShiftRight);
  reelHeld = sprint || !!keys.KeyR || reelTouch || autoReel;
  shootHeld = !!keys.KeyF || shootTouch || vrShoot;
  const lk=1.9*dt*S.sens;
  if(keys.ArrowLeft) yaw+=lk; if(keys.ArrowRight) yaw-=lk;
  if(keys.ArrowUp) pitch+=lk*(S.invY?-1:1); if(keys.ArrowDown) pitch-=lk*(S.invY?-1:1);
  pitch=THREE.MathUtils.clamp(pitch,-1.25,1.35);
  // Touch
  if(joyId!==null){ mx+=joyV.x; mz-=joyV.y; if(Math.hypot(joyV.x,joyV.y)>0.92) sprint=true; }
  // VR
  if(vrActive){
    let vmx=0,vmz=0,turn=0,reel=false,jump=false;
    for(let i=0;i<2;i++){
      const inp=ctrl[i].userData.input; if(!inp||!inp.gamepad) continue;
      const gp=inp.gamepad, ax=gp.axes;
      const sx=ax.length>=4?ax[2]:(ax[0]||0), sy=ax.length>=4?ax[3]:(ax[1]||0);
      if(inp.handedness==='left'){ vmx=sx; vmz=-sy; } else if(inp.handedness==='right'){ turn=sx; }
      if(gp.buttons[1]&&gp.buttons[1].pressed) reel=true;
      const sb=!!(gp.buttons[3]&&gp.buttons[3].pressed); if(sb&&!ctrl[i].userData.sb){ if(inp.handedness==='left') doDash(); else spinNet(); } ctrl[i].userData.sb=sb;
      const jb=!!((gp.buttons[4]&&gp.buttons[4].pressed)||(gp.buttons[5]&&gp.buttons[5].pressed));
      if(jb&&!ctrl[i].userData.jb) jump=true; ctrl[i].userData.jb=jb;
    }
    if(Math.abs(vmx)<0.15) vmx=0; if(Math.abs(vmz)<0.15) vmz=0;
    mx+=vmx; mz+=vmz; reelHeld=reelHeld||reel;
    if(Math.abs(turn)<0.3) snapCool=0;
    else if(Math.abs(turn)>0.7 && snapCool<=0){ rig.rotation.y+=(turn>0?-1:1)*Math.PI/6; snapCool=0.35; }
    if(snapCool>0 && Math.abs(turn)>0.3) snapCool-=dt;
    if(jump) doJump();
    if(Math.hypot(vmx,vmz)>0.92) sprint=true;
  }
  const l=Math.hypot(mx,mz); if(l>1){mx/=l;mz/=l;}
  input.mx=mx; input.mz=mz; input.sprint=sprint;
  if(bot.active){ bot.in.x=mx; bot.in.z=mz; bot.sprint=sprint; input.mx=0; input.mz=0; input.sprint=false; shootHeld=false; } else { bot.in.x=0; bot.in.z=0; }
  if(webWant && !web.active){ attachTimer+=dt; if(attachTimer>0.08){ attachTimer=0; tryAttach(false); } }
}

/* ================= Physik ================= */
function step(h){
  const wasG=grounded; grounded=false; touchWall=false;
  const fly=flying(), fast=S.debug&&dbg.fast?2:1;
  const fx=-Math.sin(heading), fz=-Math.cos(heading), rx=Math.cos(heading), rz=-Math.sin(heading);
  const wx=rx*input.mx+fx*input.mz, wz=rz*input.mx+fz*input.mz;
  const hasIn=(input.mx!==0||input.mz!==0);

  if(dashT>0){ vel.copy(dashDir).multiplyScalar(46); dashT-=h; if(dashT<=0) vel.multiplyScalar(0.5); } else if(fly){
    const up=((keys.Space||crea.upHeld)?1:0)-((keys.ControlLeft||keys.KeyC||(MAP.empty&&reelTouch))?1:0);
    const f=aimDir(tB); const wy=f.y*input.mz+up;
    const sp=34*fast*(MAP.empty&&input.sprint?2.2:1);
    vel.set((rx*input.mx+f.x*input.mz)*sp, wy*sp, (rz*input.mx+f.z*input.mz)*sp);
    releaseWeb();
  } else {
    if(wasG){
      const spd=(input.sprint?20:12)*fast;
      let ax=wx*spd-vel.x, az=wz*spd-vel.z; const l=Math.hypot(ax,az);
      const maxA=(hasIn?55:32)*h;
      if(l>maxA){ax*=maxA/l;az*=maxA/l;}
      vel.x+=ax; vel.z+=az;
    } else if(hasIn){
      vel.x+=wx*14*fast*h; vel.z+=wz*14*fast*h;
    }
    vel.y-=26*h;
  }

  if(web.active && reelHeld) web.len=Math.max(4,web.len-30*h);

  pos.addScaledVector(vel,h);

  if(web.active){
    tA.subVectors(pos,web.anchor); const dist=tA.length();
    if(dist>web.len){
      tA.multiplyScalar(1/dist); pos.copy(web.anchor).addScaledVector(tA,web.len);
      const vr=vel.dot(tA); if(vr>0) vel.addScaledVector(tA,-vr);
    }
  }

  // Gebäude
  forBoxes(pos.x-R-1,pos.z-R-1,pos.x+R+1,pos.z+R+1,b=>{
    const cx=Math.max(b.x0,Math.min(pos.x,b.x1)), cy=Math.max(b.y0,Math.min(pos.y,b.y1)), cz=Math.max(b.z0,Math.min(pos.z,b.z1));
    const dx=pos.x-cx, dy=pos.y-cy, dz=pos.z-cz, d2=dx*dx+dy*dy+dz*dz;
    if(d2>=R*R) return;
    if(d2>1e-8){
      const d=Math.sqrt(d2), nx=dx/d, ny=dy/d, nz=dz/d;
      pos.x+=nx*(R-d); pos.y+=ny*(R-d); pos.z+=nz*(R-d);
      const vn=vel.x*nx+vel.y*ny+vel.z*nz;
      if(vn<0){ vel.x-=nx*vn; vel.y-=ny*vn; vel.z-=nz*vn; }
      if(ny>0.6) grounded=true; else touchWall=true;
    } else {
      const pxa=pos.x-b.x0, pxb=b.x1-pos.x, pza=pos.z-b.z0, pzb=b.z1-pos.z, pya=b.y1-pos.y;
      const m=Math.min(pxa,pxb,pza,pzb,pya);
      if(m===pya){ pos.y=b.y1+R; if(vel.y<0)vel.y=0; grounded=true; }
      else if(m===pxa){ pos.x=b.x0-R; if(vel.x>0)vel.x=0; }
      else if(m===pxb){ pos.x=b.x1+R; if(vel.x<0)vel.x=0; }
      else if(m===pza){ pos.z=b.z0-R; if(vel.z>0)vel.z=0; }
      else { pos.z=b.z1+R; if(vel.z<0)vel.z=0; }
    }
  });
  if(touchWall) vel.multiplyScalar(1-1.2*h);
  collideCars(h);

  // Boden
  if(pos.y<R){ pos.y=R; if(vel.y<0) vel.y=0; grounded=true; }
  // Weltgrenzen
  const lim=HALF-8;
  if(pos.x>lim){pos.x=lim;if(vel.x>0)vel.x=0;} if(pos.x<-lim){pos.x=-lim;if(vel.x<0)vel.x=0;}
  if(pos.z>lim){pos.z=lim;if(vel.z>0)vel.z=0;} if(pos.z<-lim){pos.z=-lim;if(vel.z<0)vel.z=0;}
  if(pos.y>650){pos.y=650;if(vel.y>0)vel.y=0;}
  // Tempolimit & leichter Luftwiderstand
  if(!grounded) vel.multiplyScalar(1-0.012*h);
  const sp=vel.length(); if(sp>95) vel.multiplyScalar(95/sp);
}
function stepPhysics(dt){
  const n=Math.max(1,Math.ceil(dt/(1/120))), h=dt/n;
  for(let i=0;i<n;i++) step(h);
  // Orbs
  for(const o of orbs){
    if(o.got) continue;
    const dx=o.g.position.x-pos.x, dy=o.g.position.y-pos.y, dz=o.g.position.z-pos.z;
    if(dx*dx+dy*dy+dz*dz<7*7){
      o.got=true; o.g.visible=false; score++; ding(); onOrb();
      if(score>=ORBS){ toast(t('all')); setTimeout(resetOrbs,4000); }
    }
  }
}

let curFov=70;
function updateCamera(dt){
  const sp=vel.length();

    rig.position.set(pos.x,pos.y-R,pos.z); rig.updateMatrixWorld(true);
    camera.getWorldDirection(tA); heading=Math.atan2(-tA.x,-tA.z);

  }
  heading=yaw;
  const dist=7+Math.min(sp,50)*0.04;

  tB.set(pos.x,pos.y+0.9,pos.z);
  const tt=raycastCity(tB,tC.copy(f).negate(),dist+0.5);

  tD.copy(tB).addScaledVector(f,-use);
  if(tD.y<0.8) tD.y=0.8;
  camera.position.lerp(tD,1-Math.exp(-22*dt));

  const fv=S.fov+Math.min(sp,60)*0.22+(dashT>0?14:0);

}

/* ---------- zusätzliche Sounds ---------- */
function blip(f0,f1,dur,type,vol){
  if(!ac) return;
  try{
    const o=ac.createOscillator(), g=ac.createGain(); o.type=type;
    o.frequency.setValueAtTime(f0,ac.currentTime); o.frequency.exponentialRampToValueAtTime(f1,ac.currentTime+dur);
    g.gain.setValueAtTime(vol,ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+dur);
    o.connect(g); g.connect(master); o.start(); o.stop(ac.currentTime+dur+0.02);
  }catch(e){}
}
function boom(){
  if(!ac) return;
  try{
    const len=Math.floor(ac.sampleRate*0.4), buf=ac.createBuffer(1,len,ac.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.5);
    const sr=ac.createBufferSource(); sr.buffer=buf;
    const f=ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value=700;
    const g=ac.createGain(); g.gain.value=1; sr.connect(f); f.connect(g); g.connect(master); sr.start();
  }catch(e){}
}

const droneBodyGeo=new THREE.SphereGeometry(1.1,12,10), droneRingGeo=new THREE.TorusGeometry(1.7,0.2,6,18), eyeGeo=new THREE.SphereGeometry(0.4,8,6);

    shootT:2+Math.random()*2,stuckT:0,dead:false,orbitA:Math.random()*6.28,dir:Math.random()<0.5?1:-1,

function updateEnemies(dt){

function updateBolts(dt){

    const b=bolts[i]; if(!b) continue; const step=b.v.length()*dt; tA.copy(b.v).normalize(); b.life-=dt;

    const b=eBolts[i]; if(!b) continue; const step=b.v.length()*dt; tA.copy(b.v).normalize(); b.life-=dt;
    let dead=b.life<=0;
    if(raycastCity(b.m.position,tA,step+0.2)<step+0.2) dead=true;

let autoReel=false, webT=0, markerT=0;
const ELEV=[0.26,0.44,0.61,0.79,0.96,1.13,1.3];
const YOFF=[-0.87,-0.52,-0.26,0,0.26,0.52,0.87];
// Bewegungsrichtung: Tempo > Stick > Kamera
function travelDir(out){
  const hs=Math.hypot(vel.x,vel.z);
  const fx=-Math.sin(heading), fz=-Math.cos(heading), rx=Math.cos(heading), rz=-Math.sin(heading);
  if(hs>10) out.set(vel.x,0,vel.z);
  else if(input.mx||input.mz) out.set(rx*input.mx+fx*input.mz,0,rz*input.mx+fz*input.mz);
  else out.set(fx,0,fz);
  if(out.lengthSq()<1e-6) out.set(fx,0,fz);
  return out.normalize();
}
// Bewertet viele Strahlen und wählt den besten Ankerpunkt für einen Schwung
function findAnchorAuto(o){

    const c=(Math.floor(Math.random()*(2*LN+1))-LN)*P, sp=(Math.random()*2-1)*(HALF-60), lat=c+side*12.4;
    peds.push({axis,dir,side,c,x:axis===0?sp:lat,z:axis===0?lat:sp,base:1.2+Math.random()*0.8,run:0,phase:Math.random()*6.28,rot:0});
    c1.setHex(top[(Math.random()*top.length)|0]); pedTorso.setColorAt(i,c1);
    c2.setHex(bot[(Math.random()*bot.length)|0]); pedLegs.setColorAt(i,c2);
    c3.setHex(skin[(Math.random()*skin.length)|0]); pedHead.setColorAt(i,c3);
  }
  if(pedTorso.instanceColor){ pedTorso.instanceColor.needsUpdate=true; pedLegs.instanceColor.needsUpdate=true; pedHead.instanceColor.needsUpdate=true; }
}
function updatePeds(dt){
  const cx=camera.position.x, cz=camera.position.z, psp=vel.length();
  for(let i=0;i<peds.length;i++){
    const p=peds[i], sC=p.axis===0?p.x:p.z;
    const dx=p.x-pos.x, dz=p.z-pos.z;
    if(psp>12&&dx*dx+dz*dz<144) p.run=3;
    if(p.run>0) p.run-=dt;
    const sp=p.base*(p.run>0?2.6:1);
    const ns=sC+p.dir*sp*dt, lat=p.c+p.side*12.4;
    if(p.axis===0){ p.x=ns; p.z+=(lat-p.z)*Math.min(1,dt*2); } else { p.z=ns; p.x+=(lat-p.x)*Math.min(1,dt*2); }
    if(ns>HALF-20||ns<-HALF+20){ p.dir=-p.dir; }
    else {
      const k0=Math.floor(sC/P), k1=Math.floor(ns/P);
      if(k0!==k1){
        const cc=(p.dir>0?k1:k0)*P;
        if(Math.abs(cc)<=LN*P&&Math.random()<0.4){ p.axis=1-p.axis; p.dir=Math.random()<0.5?1:-1; p.c=cc; p.side=Math.random()<0.5?1:-1; }
      }
    }
    p.phase+=dt*sp*4;
    const tr=p.axis===0?p.dir*Math.PI/2:(p.dir>0?0:Math.PI);
    p.rot+=angDiff(p.rot,tr)*Math.min(1,dt*8);
    const vis=(p.x-cx)*(p.x-cx)+(p.z-cz)*(p.z-cz)<300*300;
    const bob=Math.abs(Math.sin(p.phase))*0.07;
    setInst(pedTorso,i,p.x,1.15+bob,p.z,p.rot,vis);
    setInst(pedLegs,i,p.x,0.4+bob*0.5,p.z,p.rot,vis);
    setInst(pedHead,i,p.x,1.7+bob,p.z,p.rot,vis);
  }
  pedTorso.instanceMatrix.needsUpdate=true; pedLegs.instanceMatrix.needsUpdate=true; pedHead.instanceMatrix.needsUpdate=true;
}

function csShot(i){

function csEnd(){
  if(!cs) return;
  const cb=cs.cb; if(cs.prop) scene.remove(cs.prop);
  cs=null; $('cut').hidden=true; document.body.classList.remove('cut');
  curFov=-1; camera.fov=S.fov; camera.updateProjectionMatrix();
  lockPointer(); if(cb) cb();
}
function csNext(){
  if(!cs) return;
  if(cs.i+1>=cs.shots.length){ csEnd(); return; }
  cs.el=cs.shots.slice(0,cs.i+1).reduce((a,x)=>a+x.d,0);
  csShot(cs.i+1);
}
function playCutscene(key,title,text,cb){
  if(vrActive){ showVrMsg(title,text,11); if(cb) cb(); return; }

  if(bot.active) botEnd(false);
  cs={key,shots,i:0,t:0,el:0,total:shots.reduce((a,x)=>a+x.d,0),cb,H:pos.clone(),prop:null};
  if(key==='boss'){ cs.prop=makeDrone(true).g; scene.add(cs.prop); }

  document.body.classList.add('cut'); $('cut').hidden=false; $('cutTitle').textContent=title;

}
function updateCutscene(dt){
  cs.t+=dt; cs.el+=dt;
  if(cs.t>=cs.shots[cs.i].d){ csNext(); if(!cs) return; }
  const sh=cs.shots[cs.i], e=ease(Math.min(1,cs.t/sh.d));
  if(cs.prop){
    const gp=Math.min(1,cs.el/cs.total*1.25);
    cs.prop.position.set(cs.H.x,cs.H.y+mix(230,40,ease(gp)),cs.H.z-85); cs.prop.lookAt(cs.H);
  }
  const r=sh.cam(e,cs.H,cs);
  camera.position.set(r.p[0],r.p[1],r.p[2]); camera.lookAt(r.l[0],r.l[1],r.l[2]);
  if(Math.abs(camera.fov-55)>0.1){ camera.fov=55; camera.updateProjectionMatrix(); }
}

function updateSnow(dt){

  const tt=performance.now()/900;
  for(let i=0;i<a.length;i+=3){
    let x=a[i], y=a[i+1], z=a[i+2];
    y-=dt*(5+(i/3)%5); x+=Math.sin(i+tt)*dt*1.5;
    a[i]=cx+(((x-cx+70)%140)+140)%140-70;
    a[i+1]=cy+(((y-cy+40)%80)+80)%80-40;
    a[i+2]=cz+(((z-cz+70)%140)+140)%140-70;
  }
  snowPts.geometry.attributes.position.needsUpdate=true;
}

  const a=Math.random()*Math.PI*2, d=90+Math.random()*70;
  const x=THREE.MathUtils.clamp(pos.x+Math.cos(a)*d,-HALF+40,HALF-40);
  const z=THREE.MathUtils.clamp(pos.z+Math.sin(a)*d,-HALF+40,HALF-40);
  const axis=Math.random()<0.5?0:1, dir=Math.random()<0.5?1:-1, side=Math.random()<0.5?1:-1;
  const c=axis===0?snapStreet(z):snapStreet(x);
  const k={kind,axis,dir,side,c,t:kind==='car'?85:70,stuckT:0,hp:kind==='car'?8:2,x:0,z:0,fire:2+Math.random()*2,car:null,g:null,beam:null};
  if(kind==='car'){
    let car=null; for(let i=NCARS;i<cars.length;i++) if(cars[i].off){ car=cars[i]; break; }
    if(!car){ spawnCrime('foot'); return; }
    car.off=false; car.ghost=true; car.axis=axis; car.dir=dir; car.c=c; car.lane=laneOf(axis,dir,c);
    car.speed=8; car.vmax=17; car.x=axis===0?x:car.lane; car.z=axis===0?car.lane:z;
    car.rot=axis===0?dir*Math.PI/2:(dir>0?0:Math.PI);
    k.car=car; k.x=car.x; k.z=car.z;
  } else {
    k.x=axis===0?x:c+side*12.4; k.z=axis===0?c+side*12.4:z;

function removeCrime(k,quiet){

// Räuber laufen an Kreuzungen in die Richtung, die vom Spieler wegführt
function moveFoot(k,dt){
  const sp=7.5, sC=k.axis===0?k.x:k.z, ns=sC+k.dir*sp*dt, lat=k.c+k.side*12.4;
  if(k.axis===0){ k.x=ns; k.z+=(lat-k.z)*Math.min(1,dt*3); } else { k.z=ns; k.x+=(lat-k.x)*Math.min(1,dt*3); }
  if(ns>HALF-25||ns<-HALF+25){ k.dir=-k.dir; return; }
  const k0=Math.floor(sC/P), k1=Math.floor(ns/P);
  if(k0===k1) return;
  const cc=(k.dir>0?k1:k0)*P; if(Math.abs(cc)>LN*P) return;
  const opts=[[k.axis,k.dir],[1-k.axis,1],[1-k.axis,-1]];
  let best=opts[0], bd=-1;
  for(const o of opts){
    let px, pz;
    if(o[0]===k.axis){ px=k.axis===0?cc+o[1]*50:k.x; pz=k.axis===0?k.z:cc+o[1]*50; }
    else { px=k.axis===0?cc:k.x+o[1]*50; pz=k.axis===0?k.z+o[1]*50:cc; }
    if(Math.abs(px)>HALF-30||Math.abs(pz)>HALF-30) continue;
    const dd=(px-pos.x)*(px-pos.x)+(pz-pos.z)*(pz-pos.z);
    if(dd>bd){ bd=dd; best=o; }
  }
  if(Math.random()<0.15) best=opts[(Math.random()*3)|0];
  if(best[0]!==k.axis){ k.axis=best[0]; k.c=cc; k.side=Math.random()<0.5?1:-1; }
  k.dir=best[1];
}
function updateCrimes(dt){
  crimeT-=dt;
  const ch=objActive&&CH[chapterIdx].type==='robbers';
  if(ch){
    const need=CH[chapterIdx].n-chapterProg;
    if(crimes.length<Math.min(2,need)&&crimeT<=0){ spawnCrime(Math.random()<0.35?'car':'foot'); crimeT=3; }
  } else if(freeMode&&crimes.length<1&&crimeT<=0){ spawnCrime(Math.random()<0.4?'car':'foot'); crimeT=35+Math.random()*25; }
  for(let i=crimes.length-1;i>=0;i--){
    const k=crimes[i]; k.t-=dt;
    if(k.stuckT>0) k.stuckT-=dt;
    for(const n of nets){
      const dx=k.x-n.m.position.x, dz=k.z-n.m.position.z;
      if(dx*dx+dz*dz<30.25) k.stuckT=Math.max(k.stuckT,3);
    }
    if(k.kind==='foot'){
      if(k.stuckT<=0) moveFoot(k,dt);
      const tr=k.axis===0?k.dir*Math.PI/2:(k.dir>0?0:Math.PI);
      k.g.rotation.y+=angDiff(k.g.rotation.y,tr)*Math.min(1,dt*8);
      k.g.position.set(k.x,k.stuckT>0?0:Math.abs(Math.sin(performance.now()/110))*0.12,k.z);
      const dx=k.x-pos.x, dz=k.z-pos.z, dy=1-pos.y;
      if(dx*dx+dz*dz+dy*dy<(R+0.9)*(R+0.9)){ stopCrime(k); continue; }
    } else {
      const c=k.car; k.x=c.x; k.z=c.z; c.vmax=k.stuckT>0?0:17;
      k.fire-=dt;
      if(k.fire<=0&&k.stuckT<=0){
        k.fire=3+Math.random()*2;
        const dx=pos.x-c.x, dz=pos.z-c.z, dy=pos.y-1.5, dd=Math.sqrt(dx*dx+dy*dy+dz*dz);
        if(dd<70&&dd>8){ tC.set(dx/dd,dy/dd,dz/dd); spawnBolt(eBolts,eBoltMat,tD.set(c.x,1.6,c.z),tC,32,4,6); }
      }
    }
    k.beam.position.set(k.x,45,k.z);
    const rad=k.kind==='car'?2.8:1.4, cy=k.kind==='car'?1:1.1;
    for(const b of bolts){
      if(b.life<=0) continue;
      const bp=b.m.position, dx=bp.x-k.x, dy=bp.y-cy, dz=bp.z-k.z;
      if(dx*dx+dy*dy+dz*dz<rad*rad){ b.life=0; k.hp-=1; if(k.hp<=0){ stopCrime(k); break; } }
    }
    if(crimes.indexOf(k)<0) continue;
    if(k.t<=0) escapeCrime(k);
  }
}
function updateCrimeHud(){

function drawMiniCrimes(g,c,scale,fx,fz,rx,rz){

const bot={active:false,p:new THREE.Vector3(),n:new THREE.Vector3(0,1,0),fwd:new THREE.Vector3(0,0,-1),r:0.28,t:0,
  yawPrev:0,pitchSaved:0,in:{x:0,z:0},sprint:false,cd:0,phase:0,moving:0,third:false,g:null,legs:[]};
const sfP=new THREE.Vector3(), sfN=new THREE.Vector3();
const bv1=new THREE.Vector3(), bv2=new THREE.Vector3(), bv3=new THREE.Vector3();
const bq=new THREE.Quaternion(), bM=new THREE.Matrix4();

// nächste Oberfläche (Gebäudewände, Dächer, Boden); Rückgabe: Abstand oder -1
function closestSurface(p,rq){
  let bd=rq*rq, found=false;
  if(p.y<rq){
    const py=Math.max(p.y,0), d2=py*py;
    if(d2<bd){ bd=d2; found=true; sfP.set(p.x,0,p.z); sfN.set(0,1,0); }
  }
  forBoxes(p.x-rq,p.z-rq,p.x+rq,p.z+rq,b=>{
    const cx=Math.max(b.x0,Math.min(p.x,b.x1)), cy=Math.max(b.y0,Math.min(p.y,b.y1)), cz=Math.max(b.z0,Math.min(p.z,b.z1));
    const dx=p.x-cx, dy=p.y-cy, dz=p.z-cz, d2=dx*dx+dy*dy+dz*dz;
    if(d2>=bd) return;
    if(d2>1e-10){
      bd=d2; found=true; sfP.set(cx,cy,cz); const d=Math.sqrt(d2); sfN.set(dx/d,dy/d,dz/d);
    } else {
      const a=p.x-b.x0, bb=b.x1-p.x, c=p.z-b.z0, dd=b.z1-p.z, e=b.y1-p.y, m=Math.min(a,bb,c,dd,e);
      bd=0; found=true;
      if(m===e){ sfP.set(p.x,b.y1,p.z); sfN.set(0,1,0); }
      else if(m===a){ sfP.set(b.x0,p.y,p.z); sfN.set(-1,0,0); }
      else if(m===bb){ sfP.set(b.x1,p.y,p.z); sfN.set(1,0,0); }
      else if(m===c){ sfP.set(p.x,p.y,b.z0); sfN.set(0,0,-1); }
      else { sfP.set(p.x,p.y,b.z1); sfN.set(0,0,1); }
    }
  });
  return found?Math.sqrt(bd):-1;
}
function rotAbout(v,axis,ang){
  const c=Math.cos(ang), sn=Math.sin(ang), d=axis.dot(v)*(1-c);
  bv3.crossVectors(axis,v);
  v.set(v.x*c+bv3.x*sn+axis.x*d, v.y*c+bv3.y*sn+axis.y*d, v.z*c+bv3.z*sn+axis.z*d);
}

function makeBotMesh(){
  const g=new THREE.Group();
  const bodyM=new THREE.MeshLambertMaterial({color:0x2a2f3a}), legM=new THREE.MeshLambertMaterial({color:0x6a7386});
  const lensM=new THREE.MeshBasicMaterial({color:0x4dffb0,fog:false}), redM=new THREE.MeshBasicMaterial({color:0xff3b3b,fog:false});
  const body=new THREE.Mesh(new THREE.SphereGeometry(0.28,10,8),bodyM); body.scale.set(1,0.7,1.2); body.position.y=0.28; g.add(body);
  const lens=new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,0.1,10),lensM); lens.rotation.x=Math.PI/2; lens.position.set(0,0.3,0.36); g.add(lens);
  const led=new THREE.Mesh(new THREE.SphereGeometry(0.05,6,5),redM); led.position.set(0,0.5,-0.1); g.add(led);
  bot.legs.length=0;
  for(let i=0;i<8;i++){
    const side=i<4?-1:1, k=i%4;
    const pivot=new THREE.Group(); pivot.position.set(side*0.22,0.28,(k-1.5)*0.18);
    const up=new THREE.Mesh(new THREE.BoxGeometry(0.4,0.04,0.04),legM); up.position.x=side*0.2; pivot.add(up);
    const low=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.3,0.04),legM); low.position.set(side*0.4,-0.14,0); pivot.add(low);
    g.add(pivot); bot.legs.push({pivot,side,k});
  }
  g.scale.setScalar(1.3);
  return g;
}

/* ---------- Start / Ende / Explosion ---------- */
function deployBot(){
  if(bot.active||bot.cd>0||isPaused()) return;
  if(vrActive){ toast(t('botNoVR')); return; }
  releaseWeb(); webWant=false;
  aimDir(bv1); bv2.set(pos.x,pos.y+0.4,pos.z);
  let tt=raycastCity(bv2,bv1,30);
  if(bv1.y<-0.02){ const tg=-bv2.y/bv1.y; if(tg>0&&tg<tt) tt=tg; }
  if(!(tt<Infinity)) bv3.set(pos.x-Math.sin(yaw)*1.5,0.3,pos.z-Math.cos(yaw)*1.5);
  else bv3.copy(bv2).addScaledVector(bv1,Math.max(0.5,tt-0.3));
  if(closestSurface(bv3,3)<0){ bv3.set(pos.x,0.3,pos.z); closestSurface(bv3,3); }
  bot.n.copy(sfN); bot.p.copy(sfP).addScaledVector(sfN,bot.r);

  bot.fwd.normalize();

/* ---------- Krabbeln auf Oberflächen ---------- */
function updateBot(dt){
  bot.cd=Math.max(0,bot.cd-dt);
  if(!bot.active) return;
  bot.t-=dt; if(bot.t<=0){ botExplode(); return; }
  const dy=yaw-bot.yawPrev; bot.yawPrev=yaw;
  if(dy) rotAbout(bot.fwd,bot.n,dy);
  bv1.crossVectors(bot.fwd,bot.n);
  bv2.set(0,0,0).addScaledVector(bot.fwd,bot.in.z).addScaledVector(bv1,bot.in.x);
  const mv=bv2.length(), sp=7*(bot.sprint?1.8:1);
  bot.moving+=((mv>0.05?1:0)-bot.moving)*Math.min(1,dt*8);
  bv3.copy(bot.p);
  bot.p.addScaledVector(bv2,sp*dt);
  const lim=HALF-4; bot.p.x=Math.max(-lim,Math.min(lim,bot.p.x)); bot.p.z=Math.max(-lim,Math.min(lim,bot.p.z));
  if(closestSurface(bot.p,bot.r+1.3)<0){ bot.p.copy(bv3); }
  else {
    bv1.copy(sfN);
    if(bv1.dot(bot.n)<0.9995){ bq.setFromUnitVectors(bot.n,bv1); bot.fwd.applyQuaternion(bq); }
    bot.n.copy(bv1); bot.p.copy(sfP).addScaledVector(bot.n,bot.r);
    bot.fwd.addScaledVector(bot.n,-bot.fwd.dot(bot.n));
    if(bot.fwd.lengthSq()<1e-6){ bot.fwd.set(0,0,-1); bot.fwd.addScaledVector(bot.n,-bot.fwd.dot(bot.n)); if(bot.fwd.lengthSq()<1e-6) bot.fwd.set(1,0,0); }
    bot.fwd.normalize();
  }
  if(bot.g){
    bot.g.position.copy(bot.p).addScaledVector(bot.n,-bot.r);
    bv1.crossVectors(bot.n,bot.fwd);
    bM.makeBasis(bv1,bot.n,bot.fwd); bot.g.quaternion.setFromRotationMatrix(bM);
    bot.phase+=dt*(3+bot.moving*(bot.sprint?18:11));
    for(const l of bot.legs){
      const ph=bot.phase+l.k*1.7+(l.side>0?Math.PI:0);
      l.pivot.rotation.y=Math.sin(ph)*0.35*bot.moving;
      l.pivot.rotation.z=l.side*0.15+Math.cos(ph)*0.12*bot.moving;
    }
  }
}
function updateBotCam(dt){

function gridRemove(b){
  const c0=Math.floor(b.x0/CELL), c1=Math.floor(b.x1/CELL), d0=Math.floor(b.z0/CELL), d1=Math.floor(b.z1/CELL);
  for(let a=c0;a<=c1;a++) for(let c=d0;c<=d1;c++){
    const arr=grid.get(gridKey(a,c)); if(!arr) continue;

}
function addCreaBlock(x0,y0,z0,w,h,d,ci){

/* ---------- Zielen: Strahl gegen Boden und Blöcke ---------- */
const cRay={t:Infinity,box:null,axis:-1,sign:0,ground:false};
function creaRay(o,d,maxT){
  cRay.t=maxT; cRay.box=null; cRay.ground=false; cRay.axis=-1;
  if(d.y<-1e-5){ const tg=-o.y/d.y; if(tg>0&&tg<cRay.t){ cRay.t=tg; cRay.ground=true; } }
  const ex=o.x+d.x*maxT, ez=o.z+d.z*maxT;
  forBoxes(Math.min(o.x,ex)-1,Math.min(o.z,ez)-1,Math.max(o.x,ex)+1,Math.max(o.z,ez)+1,b=>{
    const mn=[b.x0,b.y0,b.z0], mx=[b.x1,b.y1,b.z1], oa=[o.x,o.y,o.z], da=[d.x,d.y,d.z];
    let t0=0, t1=cRay.t, ax=-1, sg=0;
    for(let k=0;k<3;k++){
      if(Math.abs(da[k])<1e-8){ if(oa[k]<mn[k]||oa[k]>mx[k]) return; }
      else {
        let a=(mn[k]-oa[k])/da[k], c=(mx[k]-oa[k])/da[k];
        if(a>c){ const q=a; a=c; c=q; }
        if(a>t0){ t0=a; ax=k; sg=da[k]>0?-1:1; }
        if(c<t1) t1=c;
        if(t0>t1) return;
      }
    }
    if(t0>0&&t0<cRay.t&&ax>=0){ cRay.t=t0; cRay.box=b; cRay.axis=ax; cRay.sign=sg; cRay.ground=false; }
  });
  return cRay.t<maxT;
}
function creaTarget(){
  aimDir(cv1); cv2.copy(camera.position);
  if(!creaRay(cv2,cv1,90)) return null;
  const sn=crea.snap, W=crea.w, H=crea.h, D=crea.d, q=v=>Math.round(v/sn)*sn;
  const px=cv2.x+cv1.x*cRay.t, py=cv2.y+cv1.y*cRay.t, pz=cv2.z+cv1.z*cRay.t;
  let x0, y0, z0;
  if(cRay.ground){ x0=q(px-W/2); z0=q(pz-D/2); y0=0; }
  else {
    const b=cRay.box;
    x0=q(px-W/2); y0=q(py-H/2); z0=q(pz-D/2);
    if(cRay.axis===0) x0=cRay.sign>0?b.x1:b.x0-W;
    else if(cRay.axis===1) y0=cRay.sign>0?b.y1:b.y0-H;
    else z0=cRay.sign>0?b.z1:b.z0-D;
  }
  const lim=HALF-4;
  x0=Math.max(-lim,Math.min(lim-W,x0)); z0=Math.max(-lim,Math.min(lim-D,z0)); if(y0<0) y0=0;
  return {x0,y0,z0};
}

function creaApply(str){
  const o=JSON.parse(str); if(!o||!Array.isArray(o.b)) throw new Error('bad');

  }

}

function onVREnd(){
  vrActive=false; document.body.classList.remove('vr'); vrHud.visible=false; $('gear').style.display='';
  rig.position.set(0,0,0); rig.rotation.set(0,0,0);
  setWebWant(false,-1); camera.position.set(pos.x,pos.y+3,pos.z+7);
  onResize(); log('VR beendet');
}
if(navigator.xr && navigator.xr.isSessionSupported){
  navigator.xr.isSessionSupported('immersive-vr').then(ok=>{ if(ok) $('btnVR').hidden=false; else $('vrNote').textContent=t('vrNo'); }).catch(()=>{});
} else { $('vrNote').textContent=t('vrNo'); }
$('btnVR').addEventListener('click',startVR);

/* ================= Start & Menü ================= */
function lockPointer(){
  if(isTouch||!canvas.requestPointerLock) return;
  try{ const r=canvas.requestPointerLock(); if(r&&r.catch) r.catch(()=>{}); }catch(_){}
}
$('btnPlay').addEventListener('click',()=>{ started=true; $('start').hidden=true; initAudio(); if(chapterIdx<0) beginGame(); else lockPointer(); });

function openMenu(){ S.hour=tod*24; menuOpen=true; $('menu').hidden=false; setWebWant(false,-1); if(document.exitPointerLock) document.exitPointerLock(); syncControls(); }
function closeMenu(){ persist(); menuOpen=false; $('menu').hidden=true; for(const k in keys) keys[k]=false; }
$('gear').addEventListener('click',openMenu);
$('closeBtn').addEventListener('click',closeMenu);

const ctl={dark:$('setDark'),vol:$('setVol'),mute:$('setMute'),lang:$('setLang'),font:$('setFont'),fov:$('setFov'),sens:$('setSens'),q:$('setQ'),inv:$('setInv'),auto:$('setAuto'),shader:$('setShader'),blur:$('setBlur'),cycle:$('setCycle'),hour:$('setHour')};
function syncControls(){
  ctl.dark.checked=S.dark; ctl.vol.value=S.volume; ctl.mute.checked=S.mute; ctl.lang.value=S.lang;
  ctl.font.value=S.font; ctl.fov.value=S.fov; ctl.sens.value=S.sens; ctl.q.value=S.quality; ctl.inv.checked=S.invY; ctl.auto.checked=S.autoSwing; ctl.shader.value=S.shader; ctl.blur.checked=S.speedBlur; ctl.cycle.checked=S.cycle; ctl.hour.value=S.hour; $('hourVal').textContent=hourStr(S.hour);
  $('volVal').textContent=S.volume+'%'; $('fovVal').textContent=S.fov+'°'; $('sensVal').textContent=S.sens.toFixed(1)+'x';
  $('fontVal').textContent=t('fontS')[S.font];
}
function applyLang(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ el.textContent=t(el.dataset.i18n); });
  $('hintMain').textContent=isTouch?t('hintTouch'):t('hintPC');
  $('codeIn').placeholder=t('code');
  $('fontVal').textContent=t('fontS')[S.font];
}
function applyAll(){
  document.documentElement.dataset.theme=S.dark?'dark':'light';
  document.documentElement.style.fontSize=[14,16,19][S.font]+'px';
  applyLang(); applyScene(); applyVolume(); onResize();
  $('debug').hidden=!S.debug; $('debugOff').hidden=!S.debug;
  cityMat.wireframe=S.debug&&dbg.wire;
  renderSkins(); renderMaps(); updateObjective();
}
ctl.dark.onchange=()=>{S.dark=ctl.dark.checked;applyAll();};
ctl.vol.oninput=()=>{S.volume=+ctl.vol.value;$('volVal').textContent=S.volume+'%';applyVolume();};
ctl.mute.onchange=()=>{S.mute=ctl.mute.checked;applyVolume();};
ctl.lang.onchange=()=>{S.lang=ctl.lang.value;applyAll();syncControls();};
ctl.font.oninput=()=>{S.font=+ctl.font.value;applyAll();syncControls();};
ctl.fov.oninput=()=>{S.fov=+ctl.fov.value;$('fovVal').textContent=S.fov+'°';};
ctl.sens.oninput=()=>{S.sens=+ctl.sens.value;$('sensVal').textContent=S.sens.toFixed(1)+'x';};
ctl.q.onchange=()=>{S.quality=+ctl.q.value;onResize();};
ctl.inv.onchange=()=>{S.invY=ctl.inv.checked;};
ctl.auto.onchange=()=>{S.autoSwing=ctl.auto.checked;};
ctl.shader.onchange=()=>{S.shader=+ctl.shader.value;};
ctl.blur.onchange=()=>{S.speedBlur=ctl.blur.checked;};
ctl.cycle.onchange=()=>{S.cycle=ctl.cycle.checked;};
ctl.hour.oninput=()=>{S.hour=+ctl.hour.value; tod=S.hour/24; $('hourVal').textContent=hourStr(S.hour); applyScene();};

function checkCode(){
  const v=$('codeIn').value.trim();
  if(v==='IchKaka1234'){ S.debug=true; $('codeMsg').textContent=t('debugOn'); log('Debug aktiviert'); }
  else $('codeMsg').textContent=t('wrong');
  $('codeIn').value=''; applyAll();
}
$('codeBtn').addEventListener('click',checkCode);
$('codeIn').addEventListener('keydown',e=>{ if(e.key==='Enter') checkCode(); });
$('debugOff').addEventListener('click',()=>{ S.debug=false; dbg.fly=dbg.fast=dbg.wire=dbg.god=false; $('codeMsg').textContent=''; applyAll(); });
$('resetBtn').addEventListener('click',()=>{
  S=defaults(); dbg.fly=dbg.fast=dbg.wire=dbg.god=false; $('codeMsg').textContent='';
  applyAll(); syncControls();
});

// Debug-Buttons
$('dFly').addEventListener('click',()=>{ dbg.fly=!dbg.fly; if(dbg.fly) releaseWeb(); });
$('dFast').addEventListener('click',()=>{ dbg.fast=!dbg.fast; });
$('dWire').addEventListener('click',()=>{ dbg.wire=!dbg.wire; cityMat.wireframe=dbg.wire; });
$('dRestart').addEventListener('click',()=>{ pos.copy(START); vel.set(0,0,0); releaseWeb(); webWant=false; resetOrbs(); log('Neustart'); });

/* ================= Los geht's ================= */
camera.position.set(0,4,8);
applyAll(); syncControls();
log('Stadt: '+buildings.length+' Gebäude');
})();
</script>
</body>
</html>
