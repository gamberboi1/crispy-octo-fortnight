$('rh').onpointerdown=e=>{rHeld=true;e.preventDefault()};$('rh').onpointerup=$('rh').onpointerleave=$('rh').onpointercancel=()=>{rHeld=false};
const cv=$('cv'),ctx=cv.getContext('2d');let dpr=1;
function resize(){dpr=window.devicePixelRatio||1;cv.width=cv.clientWidth*dpr;cv.height=cv.clientHeight*dpr}
addEventListener('resize',resize);
const cellAt=(px,py)=>{const cs=30*cam.z;return{x:Math.floor((px-cam.x)/cs),y:Math.floor((py-cam.y)/cs)}};
function act1(p,first){if(tool=='rot'||tool=='use'){act0(p,first);return}const x0=p.x-((bs-1)>>1),y0=p.y-((bs-1)>>1);
for(let j=0;j<bs;j++)for(let i=0;i<bs;i++)act0({x:x0+i,y:y0+j},first);
if(tool=='place'&&bs>1){for(let j=0;j<bs;j++)for(let i=0;i<bs;i++){const a=at(x0+i,y0+j);if(!a||a.t!='block')continue;
if(i<bs-1){const b=at(x0+i+1,y0+j);if(b&&b.t=='block'){a.l[1]=1;b.l[3]=1}}
if(j<bs-1){const b=at(x0+i,y0+j+1);if(b&&b.t=='block'){a.l[2]=1;b.l[0]=1}}}}}
function act0(p,first){if(p.x<0||p.y<0||p.x>=W||p.y>=H)return;const c=G[p.y][p.x];
switch(tool){
case'place':if(!c||c.t!=sel||c.d!=rot){put(p.x,p.y,sel,rot);burst(G[p.y][p.x],8)}break;
case'erase':if(c){burst(c,8);del(c)}break;
case'rot':if(first&&c)c.d=(c.d+1)%4;break;
case'weld':if(c){weld(c);if(first){log('geschweißt');burst(c,10,'#facc15')}}break;
case'unweld':if(c)unweld(c);break;
case'use':if(first&&c){if(c.t=='switch'){c.on=!c.on;burst(c,6)}if(c.t=='button'){c.h=3;burst(c,6)}}break}}
const ptrs=new Map();let act=null,pinch=null;
const pd=()=>{const[a,b]=[...ptrs.values()];return{d:Math.hypot(a.x-b.x,a.y-b.y)||1,cx:(a.x+b.x)/2,cy:(a.y+b.y)/2}};
cv.oncontextmenu=e=>e.preventDefault();
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
if(ptrs.size==2){act=null;const p=pd(),cs=30*cam.z;pinch={d:p.d,z:cam.z,wx:(p.cx-cam.x)/cs,wy:(p.cy-cam.y)/cs};return}
if(ptrs.size>1)return;
if(e.button==1||e.button==2||tool=='pan'){act={pan:1,sx:e.offsetX,sy:e.offsetY,cx:cam.x,cy:cam.y};return}
const p=cellAt(e.offsetX,e.offsetY);
if(tool!='use')snap();if(tool=='move'){grp();const c=at(p.x,p.y);if(c&&c.t!='wall'){act={mv:1,list:gm.get(c.g),lx:p.x,ly:p.y};log('Gruppe: '+act.list.length+' Teile')}return}
act={paint:1};act1(p,true)};
cv.onpointermove=e=>{hov=cellAt(e.offsetX,e.offsetY);if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.offsetX,y:e.offsetY});
if(ptrs.size==2&&pinch){const p=pd(),z=Math.min(3,Math.max(.3,pinch.z*p.d/pinch.d));cam.z=z;cam.x=p.cx-pinch.wx*30*z;cam.y=p.cy-pinch.wy*30*z;return}
if(!act)return;
if(act.pan){cam.x=act.cx+e.offsetX-act.sx;cam.y=act.cy+e.offsetY-act.sy}
else if(act.mv){const p=cellAt(e.offsetX,e.offsetY);
for(let i=0;i<30;i++){const dx=Math.sign(p.x-act.lx),dy=Math.sign(p.y-act.ly);if(!dx&&!dy)break;let m=false;
if(dx&&mv(act.list,dx,0)){act.lx+=dx;m=true}if(dy&&mv(act.list,0,dy)){act.ly+=dy;m=true}if(!m)break}}
else if(act.paint)act1(cellAt(e.offsetX,e.offsetY),false)};
cv.onpointerup=cv.onpointercancel=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(ptrs.size==0)act=null};
cv.onwheel=e=>{e.preventDefault();const cs=30*cam.z,wx=(e.offsetX-cam.x)/cs,wy=(e.offsetY-cam.y)/cs,z=Math.min(3,Math.max(.3,cam.z*(e.deltaY<0?1.12:.89)));cam.z=z;cam.x=e.offsetX-wx*30*z;cam.y=e.offsetY-wy*30*z};
addEventListener('keydown',e=>{if(menu)return;if((e.ctrlKey||e.metaKey)&&e.key=='z'){$('un').click();return}if(e.key==' '){playing=!playing;ui();e.preventDefault()}if(e.key=='r'||e.key=='R'){rHeld=true;if(!e.repeat&&!(act&&act.mv)){rot=(rot+1)%4;ui()}}});
addEventListener('keyup',e=>{if(e.key=='r'||e.key=='R')rHeld=false});
function cell(c,x,y,cs){const m=cs*.08,s=cs-2*m,cx=x+cs/2,cy=y+cs/2,t=c.t;
if(t=='lamp'){ctx.beginPath();ctx.arc(cx,cy,cs*.36,0,7);ctx.fillStyle=c.on?'#fde047':'#4b5563';if(c.on){ctx.shadowColor='#fde047';ctx.shadowBlur=cs*.7}ctx.fill();ctx.shadowBlur=0;if(c.on){ctx.fillStyle='rgba(253,224,71,.22)';ctx.beginPath();ctx.arc(cx,cy,cs*(.8+.1*Math.sin(performance.now()/150)),0,7);ctx.fill()}return}
const solid=t=='wall'||t=='block';ctx.globalAlpha=solid||c.on?1:.5;ctx.fillStyle=T[t][2];if(c.on&&!solid){ctx.shadowColor=T[t][2];ctx.shadowBlur=cs*.5}ctx.beginPath();ctx.roundRect(x+m,y+m,s,s,cs*.15);ctx.fill();ctx.shadowBlur=0;ctx.globalAlpha=1;
if(c.on){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke()}
ctx.fillStyle='#fff';
if(DIR.has(t)){ctx.save();ctx.translate(cx,cy-cs*.04);ctx.rotate(c.d*Math.PI/2);ctx.beginPath();ctx.moveTo(0,-cs*.28);ctx.lineTo(cs*.2,cs*.12);ctx.lineTo(-cs*.2,cs*.12);ctx.closePath();ctx.fill();ctx.restore()
if(c.on&&t!='thruster'){const f=(performance.now()/500)%1;ctx.fillStyle='#fff';for(const r of SPL[t]||[0]){const kk=(c.d+r)%4,q=SPL[t]?f*.5:f-.5;ctx.beginPath();ctx.arc(cx+DX[kk]*q*cs*.9,cy+DY[kk]*q*cs*.9,cs*.06,0,7);ctx.fill()}}}
if(cs>16&&T[t][3]){ctx.textAlign='center';ctx.textBaseline='middle';
if(DIR.has(t)){ctx.font='bold '+cs*.22+'px sans-serif';ctx.fillText(T[t][3],cx,y+cs*.84)}else{ctx.font='bold '+cs*.45+'px sans-serif';ctx.fillText(T[t][3],cx,cy)}}
if(showIds&&st.debug){ctx.font='10px monospace';ctx.textAlign='left';ctx.fillStyle='#000';ctx.fillText(c.g,x+3,y+10)}}
function draw(){const w=cv.clientWidth,h=cv.clientHeight,cs=30*cam.z,ox=cam.x,oy=cam.y;
ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=col.cv;ctx.fillRect(0,0,w,h);
if(shk>0){ctx.translate((Math.random()-.5)*shk,(Math.random()-.5)*shk);shk*=.85;if(shk<.3)shk=0}ctx.fillStyle=col.board;ctx.fillRect(ox,oy,W*cs,H*cs);
if(cs>9){ctx.strokeStyle=col.grid;ctx.lineWidth=1;ctx.beginPath();for(let x=0;x<=W;x++){ctx.moveTo(ox+x*cs,oy);ctx.lineTo(ox+x*cs,oy+H*cs)}for(let y=0;y<=H;y++){ctx.moveTo(ox,oy+y*cs);ctx.lineTo(ox+W*cs,oy+y*cs)}ctx.stroke()}
const A=all();
const now=performance.now();
for(const c of A){const x=ox+c.x*cs,y=oy+c.y*cs;if(x>w||y>h||x<-cs||y<-cs)continue;let k=Math.min(1,(now-c.s)/260);if(k<=0)continue;if(k<1){k=1+2.70158*Math.pow(k-1,3)+1.70158*Math.pow(k-1,2);ctx.save();ctx.translate(x+cs/2,y+cs/2);ctx.scale(k,k);ctx.translate(-x-cs/2,-y-cs/2);cell(c,x,y,cs);ctx.restore()}else cell(c,x,y,cs)}
ps=ps.filter(p=>(p.a-=.03)>0);for(const p of ps){p.x+=p.vx;p.y+=p.vy;ctx.globalAlpha=p.a;ctx.fillStyle=p.c||'rgb(255,'+(120+p.a*100|0)+',40)';ctx.beginPath();ctx.arc(ox+p.x*cs,oy+p.y*cs,cs*.12*p.a,0,7);ctx.fill()}ctx.globalAlpha=1;
rg=rg.filter(r=>now-r.t<450);for(const r of rg){const k=(now-r.t)/450;ctx.globalAlpha=1-k;ctx.strokeStyle=r.c;ctx.lineWidth=3*(1-k)+1;ctx.beginPath();ctx.arc(ox+r.x*cs,oy+r.y*cs,cs*(.3+k*.9),0,7);ctx.stroke()}ctx.globalAlpha=1;
if(tool=='place'||tool=='erase'||tool=='weld'||tool=='unweld'){ctx.strokeStyle='#3b82f6';ctx.lineWidth=2;const q=(bs-1)>>1;ctx.strokeRect(ox+(hov.x-q)*cs,oy+(hov.y-q)*cs,bs*cs,bs*cs)}
ctx.fillStyle='#facc15';ctx.strokeStyle='#1a1d23';ctx.lineWidth=1;
for(const c of A)for(const k of[1,2]){if(!c.l[k])continue;const b=at(c.x+DX[k],c.y+DY[k]);if(!b||!b.l[(k+2)%4])continue;
ctx.beginPath();ctx.arc(ox+(c.x+.5+DX[k]/2)*cs,oy+(c.y+.5+DY[k]/2)*cs,Math.max(2.5,cs*.1),0,7);ctx.fill();ctx.stroke()}}
let last=performance.now(),acc=0,fps=0,fc=0,ft=last;
function loop(t){const dt=Math.min(100,t-last);last=t;
if(rHeld&&act&&act.mv&&!menu&&t-rLast>220){rLast=t;if(rotG(act.list,act.lx,act.ly))log('gedreht')}
if(playing&&!menu){acc+=dt;const iv=1000/SPD[si]*(fast?.25:1);let n=0;while(acc>=iv&&n<5){tick();acc-=iv;n++}if(n==5)acc=0}
fc++;if(t-ft>500){fps=Math.round(fc*1000/(t-ft));fc=0;ft=t;
if(st.debug)$('dbg').textContent='FPS '+fps+'\nTick '+tk+'\nZellen '+all().length+'\nGruppen '+gm.size+'\nZoom '+cam.z.toFixed(2)+'\n'+logs.join('\n')}
draw();requestAnimationFrame(loop)}
clearAll();demo();applyTheme();ui();resize();requestAnimationFrame(loop);
