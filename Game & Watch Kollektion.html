<!DOCTYPE html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Game &amp; Watch Kollektion</title>
<style>
:root{--bg:#e6e2d3;--fg:#1d1d1d;--card:#fff;--lcd:#c4cfa6;--ac:#d6322b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#17181a;--fg:#ececec;--card:#2a2c2f;--lcd:#8c9873}
*{box-sizing:border-box}
html{font-size:16px;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;max-width:100%;-webkit-user-select:none;user-select:none}
button{font:inherit;touch-action:manipulation;cursor:pointer}
h1{margin:0;padding:12px 60px 0;font-size:1.3rem;text-align:center}
#gear{position:fixed;top:0;right:0;z-index:5;padding:calc(8px + env(safe-area-inset-top,0px)) 14px 8px;font-size:1.6rem;background:none;border:0}
#menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;max-width:640px;margin:0 auto;padding:12px}
#menu button{background:var(--card);color:var(--fg);border:2px solid var(--fg);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;position:relative}
#menu span{font-size:1.8rem}#menu small{font-size:.75rem}#menu i{position:absolute;top:2px;right:5px;font-size:.65rem;font-style:normal}
#gameS{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px}
.bar{display:flex;gap:12px;align-items:center;width:min(92vw,340px)}
.bar button,#again,.card button{background:var(--card);color:var(--fg);border:2px solid var(--fg);border-radius:8px;padding:8px 12px}
.lcd{background:var(--lcd);border:6px solid #444;border-radius:14px;width:min(92vw,340px)}
canvas{width:100%;height:auto;display:block;touch-action:manipulation}
.ctl{display:flex;gap:18px}
.btn{font-size:1.5rem;width:76px;height:76px;border-radius:50%;border:0;background:var(--ac);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.35)}
#hud{font-size:1.1rem;font-family:monospace;text-align:center;max-width:340px}
#dbgp{width:min(92vw,340px);font-size:.8rem}#dbgp pre{white-space:pre-wrap;margin:4px 0;max-width:100%;overflow-x:auto}
#dbgp button{margin:2px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9;display:flex;align-items:center;justify-content:center}
.modal[hidden],[hidden]{display:none!important}
.card{background:var(--bg);color:var(--fg);width:min(92vw,380px);max-height:88vh;overflow-y:auto;padding:16px;border-radius:14px;display:flex;flex-direction:column;gap:12px}
.card label{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
.card input[type=text]{width:100%;padding:10px;font-size:1rem}
.card input[type=checkbox]{width:26px;height:26px}.card select{padding:8px;font-size:1rem}
</style></head><body>
<button id="gear" aria-label="Einstellungen">⚙️</button>
<main id="menuS"><h1 data-i="h"></h1><div id="menu"></div></main>
<main id="gameS" hidden>
<div class="bar"><button id="back" data-i="bk"></button><b id="gt"></b></div>
<div id="hud"></div>
<div class="lcd"><canvas id="cv" width="300" height="360"></canvas></div>
<div class="ctl"><button class="btn" id="bl">◀</button><button class="btn" id="ba">A</button><button class="btn" id="br">▶</button></div>
<button id="again" hidden data-i="ag"></button>
<section id="dbgp" hidden><div>Ticks/s: <span id="fps"></span></div><pre id="dv"></pre>
<button id="gd" data-i="gd"></button><button id="fa" data-i="fa"></button><button id="rt" data-i="rt"></button><pre id="lg"></pre></section>
</main>
<div id="set" class="modal" hidden><div class="card">
<b data-i="st"></b>
<label><span data-i="dk"></span><input type="checkbox" id="dk"></label>
<label><span data-i="vo"></span><input type="range" id="vo" min="0" max="100"></label>
<label><span data-i="mu"></span><input type="checkbox" id="mu"></label>
<label><span data-i="la"></span><select id="la"><option value="de">Deutsch</option><option value="en">English</option></select></label>
<label><span data-i="fs"></span><input type="range" id="fs" min="0" max="2" step="1"></label>
<label><span data-i="co"></span></label><input type="text" id="code" autocomplete="off">
<button id="okb" data-i="ok"></button><div id="msg"></div>
<button id="dbgoff" hidden data-i="off"></button>
<button id="rs" data-i="rs"></button><button id="cl" data-i="cl"></button>
</div></div>
<script>
const $=s=>document.querySelector(s),R=n=>Math.random()*n|0;
const T={de:{h:'Game & Watch Kollektion',sc:'Punkte',go:'GAME OVER',ag:'Nochmal',bk:'‹ Menü',st:'Einstellungen',dk:'Dark-Mode',vo:'Lautstärke',mu:'Stumm',la:'Sprache',fs:'Schriftgröße',co:'Code eingeben',ok:'Bestätigen',bad:'Falscher Code',on:'Debug-Modus aktiviert',off:'Debug-Modus aus',rs:'Zurücksetzen',cl:'Schließen',gd:'Unverwundbar',fa:'Schneller',rt:'Neustart',dm:'DEMO – tippen zum Starten'},
en:{h:'Game & Watch Collection',sc:'Score',go:'GAME OVER',ag:'Again',bk:'‹ Menu',st:'Settings',dk:'Dark mode',vo:'Volume',mu:'Mute',la:'Language',fs:'Font size',co:'Enter code',ok:'Confirm',bad:'Wrong code',on:'Debug mode enabled',off:'Debug mode off',rs:'Reset',cl:'Close',gd:'Invincible',fa:'Faster',rt:'Restart',dm:'DEMO – tap to start'}};
const HT={de:{c:'◀ ▶ bewegen, gute Dinge fangen',d:'◀ ▶ bewegen, ausweichen',w:'Ziele antippen',j:'A = springen',s:'Reihenfolge merken und antippen',t:'A im richtigen Moment',x:'◀ ▶ zielen, A = abschießen',m:'◀ ▶ = hoch/runter, fangen',n:'◀ ▶ = hoch/runter, ausweichen',z:'A = vorwärts, ◀ ▶ seitlich'},en:{c:'◀ ▶ move, catch good things',d:'◀ ▶ move, dodge',w:'Tap the targets',j:'A = jump',s:'Memorize and tap the order',t:'A at the right moment',x:'◀ ▶ aim, A = shoot',m:'◀ ▶ = up/down, catch',n:'◀ ▶ = up/down, dodge',z:'A = forward, ◀ ▶ sideways'}};
// Typen: c=Fangen d=Ausweichen w=Hauen j=Springen s=Merken t=Timing x=Schießen m/n=seitlich fangen/ausweichen z=überqueren
const G=`Eier|c|🧺|🥚|
Fallschirm|c|⛵|🪂|
Äpfel|c|🧺|🍎|🐛
Münzen|c|👛|🪙|💣
Sterne|c|🧤|⭐|☄️
Pizza|c|🍽️|🍕|🧦
Regen|c|🪣|💧|
Eis|c|🍦|🍬|🌶️
Fische|c|🐈|🐟|🪨
Kirschen|c|🧺|🍒|🍄
Schatz|c|🎒|💎|🪨
Meteore|d|🚀|☄️|
Feuer|d|🧍|🔥|
Blitze|d|☂️|⚡|
Pinguin|d|🐧|🧊|
Bomben|d|🏃|💣|
Ballons|d|🎈|📌|
Vögel|d|🧑‍🌾|🐦|
Maulwurf|w||🐹|
Geister|w||👻|
Mücken|w||🦟|
Ratten|w||🐀|
Pilze|w||🍄|
Hürden|j|🏃|🚧|
Kaktus|j|🦖|🌵|
Hund|j|🐈|🐕|
Ritter|j|🤺|🪨|
Farben|s||🔴 🟡 🟢 🔵|
Tiere|s||🐶 🐱 🐭 🐹|
Karten|s||♠️ ♥️ ♦️ ♣️|
Boxen|t|🥊|🎯|
Angeln|t|🎣|🐟|
Hammer|t|🔨|📍|
Aliens|x|🚀|👾|
Zombies|x|🔫|🧟|
Monster|x|🏹|👹|
Honig|m|🐻|🍯|🐝
Sushi|m|🐱|🍣|🌶️
Fußball|m|🧤|⚽|🧱
Flugzeug|n|✈️|🦅|
Boot|n|🚤|🦈|
Astronaut|n|👨‍🚀|🛰️|
Frosch|z|🐸|🚗|
Huhn|z|🐔|🚚|
Schildkröte|z|🐢|🏍️|
Drachen|x|🏹|🐉|`.split('\n').map(l=>l.split('|'));
let S={dark:matchMedia('(prefers-color-scheme:dark)').matches,vol:70,mute:false,lang:'de',fs:1,dbg:false,god:false,fast:false};
const D=JSON.parse(JSON.stringify(S));
let cur,st,n=0,tm,paused=false,nt=0,fps=0,lg=[],hi={},ac;
const t=k=>T[S.lang][k];
function applyUI(){document.documentElement.dataset.theme=S.dark?'dark':'light';document.documentElement.style.fontSize=[14,16,19][S.fs]+'px';
document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
$('#dk').checked=S.dark;$('#vo').value=S.vol;$('#mu').checked=S.mute;$('#la').value=S.lang;$('#fs').value=S.fs;
$('#dbgoff').hidden=!S.dbg;$('#dbgp').hidden=!S.dbg;document.title=t('h')}
function menu(){$('#menu').innerHTML=G.map((g,i)=>`<button data-n="${i}"><b>${String(i+1).padStart(2,0)}</b><span>${g[1]=='s'?'🎵':g[1]=='w'?g[3]:g[2]}</span><small>${g[0]}</small>${hi[i]?`<i>★${hi[i]}</i>`:''}</button>`).join('')}
function beep(f){if(S.mute||!S.vol)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=S.vol/100*.12;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.07)}catch(e){}}
function log(m){lg.push(m);lg=lg.slice(-5)}
function pt(){st.sc++;beep(700);log('+1')}
function hurt(){if(S.god||st.demo)return;st.lv--;beep(130);log('Leben −1');if(st.lv<=0)hi[n]=Math.max(hi[n]||0,st.sc)}
function start(i,d){n=i;cur=G[i];st={sc:0,lv:3,p:2,it:[],t:0,m:0,d:1,j:0,tg:null,seq:[R(4)],ph:'show',k:0,lit:-1,fx:null,pr:5,demo:d};
$('#menuS').hidden=true;$('#gameS').hidden=false;$('#gt').textContent=String(i+1).padStart(2,0)+' '+cur[0];log('Start '+cur[0]);loop()}
function speed(){const y=cur[1],b={c:520,d:420,w:420,j:260,t:260,x:200,s:450,z:450,m:480,n:420}[y];return(y=='s'?b:Math.max(b*.35,b-st.sc*b/45))*(S.fast?.5:1)}
function loop(){clearTimeout(tm);if(!paused&&st.lv>0){step();nt++}draw();tm=setTimeout(loop,speed())}
function step(){const s=st,y=cur[1];s.t++;s.fx=null;
if(y=='c'||y=='d'){s.it.forEach(o=>o.r++);
s.it=s.it.filter(o=>{if(o.r<5)return 1;const h=o.c==s.p;if(y=='c'){o.bad?h&&hurt():h?pt():hurt()}else h?hurt():pt();return 0});
if(s.t%(y=='d'?2:3)==0)s.it.push({c:R(5),r:0,bad:y=='d'||(cur[4]&&!R(3))})}
if(y=='w'){if(s.tg&&--s.tg.l<=0){s.tg=null;hurt()}if(!s.tg&&R(2))s.tg={c:R(5),r:R(6),l:4}}
if(y=='j'){s.it.forEach(o=>o.c--);if(s.j)s.j--;s.it=s.it.filter(o=>{if(o.c==1&&!s.j){hurt();return 0}if(o.c<0){pt();return 0}return 1});if(s.t%5==0&&R(3))s.it.push({c:5,r:4})}
if(y=='t'){s.m+=s.d;if(s.m>=4||s.m<=0)s.d*=-1}
if(y=='x'){if(s.t%3==0)s.it.forEach(o=>o.r++);s.it=s.it.filter(o=>o.r<5||(hurt(),0));if(s.t%6==0)s.it.push({c:R(5),r:0})}
if(y=='m'||y=='n'){s.it.forEach(o=>o.c--);s.it=s.it.filter(o=>{if(o.c>0)return 1;const h=o.r==s.p;if(y=='m'){o.bad?h&&hurt():h?pt():hurt()}else h?hurt():pt();return 0});if(s.t%(y=='n'?2:3)==0)s.it.push({c:4,r:R(6),bad:y=='n'||(cur[4]&&!R(3))})}
if(y=='z'){s.it.forEach(o=>o.c=(o.c+o.d+5)%5);if(s.t==1)for(let r=1;r<=4;r++)for(let k=0;k<2;k++)s.it.push({c:R(5),r,d:r%2?1:-1});if(s.it.some(o=>o.c==s.p&&o.r==s.pr)){hurt();s.pr=5}}
if(y=='s'){if(s.ph=='show'){if(s.k<2*s.seq.length){s.lit=s.k%2?-1:s.seq[s.k>>1];if(!(s.k%2))beep(300+s.lit*150);s.k++}else{s.ph='in';s.k=0;s.lit=-1}}else s.lit=-1}if(s.demo)ai()}
function ai(){const s=st,y=cur[1],r='mn'.includes(y),L=o=>r?o.r:o.c,d=o=>r?o.c:5-o.r,M=r?5:4;
if('cdmn'.includes(y)){let q;
if('cm'.includes(y)){const g=s.it.filter(o=>!o.bad).sort((a,b)=>d(a)-d(b))[0];q=g&&L(g)}
else q=[...Array(M+1).keys()].filter(k=>!s.it.some(o=>L(o)==k&&d(o)<3)).sort((a,b)=>Math.abs(a-s.p)-Math.abs(b-s.p))[0];
if(q!=null&&q!=s.p)act(q<s.p?'l':'r',1)}
if(y=='w'&&s.tg&&s.tg.l<4){pt();s.tg=null}
if(y=='j'&&s.it.some(o=>o.c==3))act('a',1);
if(y=='t'&&s.m==2)act('a',1);
if(y=='x'){const e=s.it.slice().sort((a,b)=>b.r-a.r)[0];if(e)e.c==s.p?act('a',1):act(e.c<s.p?'l':'r',1)}
if(y=='z'){const k=s.pr-1;if(!s.it.some(o=>o.r==k&&(o.c==s.p||(o.c+o.d+5)%5==s.p)))act('a',1)}
if(y=='s'&&s.ph=='in'){const i=s.seq[s.k];s.lit=i;beep(300+i*150);if(++s.k==s.seq.length){pt();s.seq.push(R(4));s.ph='show';s.k=0}}}
function act(k,a){if(paused||!st||st.lv<=0)return;if(st.demo&&!a){start(n,0);return}const s=st,y=cur[1];
if(k=='l'||k=='r'){if('cdxzmn'.includes(y))s.p=Math.max(0,Math.min('mn'.includes(y)?5:4,s.p+(k=='l'?-1:1)));draw();return}
if(y=='j'&&!s.j){s.j=3;beep(500)}
if(y=='t')s.m==2?pt():hurt();
if(y=='z'){s.pr--;if(s.pr<1){pt();s.pr=5}else if(s.it.some(o=>o.c==s.p&&o.r==s.pr)){hurt();s.pr=5}}
if(y=='x'){const e=s.it.filter(o=>o.c==s.p).sort((a,b)=>b.r-a.r)[0];if(e){s.it.splice(s.it.indexOf(e),1);pt();s.fx=[e.c,e.r]}}
draw()}
const cv=$('#cv'),cx=cv.getContext('2d'),C=60;
cv.onpointerdown=ev=>{if(paused||!st||st.lv<=0)return;if(st.demo){start(n,0);return}const b=cv.getBoundingClientRect(),fx=(ev.clientX-b.left)/b.width,fy=(ev.clientY-b.top)/b.height,y=cur[1],s=st;
if(y=='w'&&s.tg&&(fx*5|0)==s.tg.c&&(fy*6|0)==s.tg.r){pt();s.tg=null}
if(y=='s'&&s.ph=='in'){const i=(fx>.5)+2*(fy>.5);s.lit=i;beep(300+i*150);if(i==s.seq[s.k]){if(++s.k==s.seq.length){pt();s.seq.push(R(4));s.ph='show';s.k=0}}else{hurt();s.ph='show';s.k=0}}
draw()};
function sp(e,c,r,a=1,z=50){if(a==1){cx.fillStyle='rgba(255,255,255,.4)';cx.fillRect(c*C+3,r*C+3,C-6,C-6)}cx.globalAlpha=a;cx.font=z+'px serif';cx.fillText(e,c*C+C/2,r*C+C/2+3);cx.globalAlpha=1}
function draw(){if(!st)return;const s=st,y=cur[1],e=cur[3];
cx.clearRect(0,0,300,360);cx.fillStyle='rgba(0,0,0,.04)';
for(let c=0;c<5;c++)for(let r=0;r<6;r++)cx.fillRect(c*C+6,r*C+6,C-12,C-12);
cx.textAlign='center';cx.textBaseline='middle';cx.filter='grayscale(1) brightness(.2)';
if(y=='s')[[1,1],[3,1],[1,4],[3,4]].forEach((q,i)=>sp(e.split(' ')[i],q[0],q[1],s.lit==i?1:.3,s.lit==i?58:40));
else{s.it.forEach(o=>sp(o.bad&&'cm'.includes(y)?cur[4]:e,o.c,o.r));
if('cdx'.includes(y))sp(cur[2],s.p,5);if('mn'.includes(y))sp(cur[2],0,s.p);if(y=='z')sp(cur[2],s.p,s.pr);
if(y=='j')sp(cur[2],1,s.j>0?3:4);
if(y=='w'&&s.tg)sp(e,s.tg.c,s.tg.r);
if(y=='t'){for(let c=0;c<5;c++)sp('▫️',c,3,.25,26);sp(e,2,3,.5);sp(cur[2],s.m,3)}
if(s.fx)sp('💥',s.fx[0],s.fx[1])}
cx.filter='none';
if(s.lv<=0){cx.fillStyle='#1d1d1d';cx.font='bold 38px monospace';cx.fillText(t('go'),150,170)}
$('#again').hidden=s.lv>0;
$('#hud').textContent=s.demo?t('dm')+' · '+HT[S.lang][y]:t('sc')+' '+s.sc+'   '+'❤️'.repeat(Math.max(0,s.lv));
if(S.dbg){$('#fps').textContent=fps;$('#dv').textContent=JSON.stringify({p:s.p,sc:s.sc,lv:s.lv,t:s.t,obj:s.it.length,ms:speed()|0});$('#lg').textContent=lg.join('\n')}}
setInterval(()=>{fps=nt;nt=0},1000);
$('#menu').onclick=e=>{const b=e.target.closest('button');if(b)start(+b.dataset.n,1)};
$('#back').onclick=()=>{clearTimeout(tm);st=null;$('#gameS').hidden=true;$('#menuS').hidden=false;menu()};
$('#again').onclick=()=>start(n);$('#rt').onclick=()=>start(n);
$('#gd').onclick=()=>{S.god=!S.god;log('Unverwundbar '+S.god)};$('#fa').onclick=()=>{S.fast=!S.fast;log('Schneller '+S.fast)};
$('#bl').onpointerdown=()=>act('l');$('#br').onpointerdown=()=>act('r');$('#ba').onpointerdown=()=>act('a');
addEventListener('keydown',e=>{const k={ArrowLeft:'l',ArrowRight:'r',' ':'a',Enter:'a',z:'a'}[e.key];if(k){e.preventDefault();act(k)}});
$('#gear').onclick=()=>{$('#set').hidden=false;paused=true};
$('#cl').onclick=()=>{$('#set').hidden=true;paused=false};
$('#dk').onchange=e=>{S.dark=e.target.checked;applyUI()};
$('#vo').oninput=e=>S.vol=+e.target.value;$('#mu').onchange=e=>S.mute=e.target.checked;
$('#la').onchange=e=>{S.lang=e.target.value;applyUI();menu()};
$('#fs').oninput=e=>{S.fs=+e.target.value;applyUI()};
$('#okb').onclick=()=>{$('#msg').textContent=$('#code').value=='IchKaka1234'?(S.dbg=true,t('on')):t('bad');applyUI()};
$('#dbgoff').onclick=()=>{S.dbg=false;$('#msg').textContent='';applyUI()};
$('#rs').onclick=()=>{Object.assign(S,D);$('#msg').textContent='';$('#code').value='';applyUI();menu()};
applyUI();menu();
</script></body></html>
