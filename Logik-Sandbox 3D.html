<script>

bar.children[0].classList.add('on');

/* Three */
const renderer=new THREE.WebGLRenderer({canvas:$('#c')});renderer.shadowMap.enabled=true;

const camera=new THREE.PerspectiveCamera(S.fov,1,.1,300);camera.rotation.order='YXZ';
scene.add(new THREE.HemisphereLight(0xffffff,0x667788,.9));
const dl=new THREE.DirectionalLight(0xffffff,.6);dl.position.set(8,16,6);dl.castShadow=true;dl.shadow.mapSize.set(1024,1024);Object.assign(dl.shadow.camera,{left:-25,right:25,top:25,bottom:-25,far:60});dl.shadow.camera.updateProjectionMatrix();scene.add(dl);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshLambertMaterial({color:0x8a9a8a}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
scene.add(new THREE.GridHelper(200,200,0x445544,0x667766));const stars=new THREE.Points(new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(Array.from({length:1800},(_,i)=>i%3===1?Math.random()*120+10:(Math.random()-.5)*400),3)),new THREE.PointsMaterial({color:0xffffff,size:1.5,sizeAttenuation:false,fog:false}));scene.add(stars);
function resize(){renderer.setPixelRatio(Math.min(devicePixelRatio,2)*S.q);renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.fov=S.fov;camera.updateProjectionMatrix()}
/* Physik */
const world=new CANNON.World();world.gravity.set(0,-9.8,0);world.solver.iterations=12;
const gb=new CANNON.Body({mass:0});gb.addShape(new CANNON.Plane());gb.quaternion.setFromAxisArray?0:0;gb.quaternion.setFromAxisAngle(new CANNON.Vec3(1,0,0),-Math.PI/2);world.addBody(gb);
const O=[],W=[],C=[],N=[],FX=[],PC=[0xff3333,0x33ff55,0x4488ff,0xffffff,0xff9900];
const GR=[-9.8,-3,0,9.8],GL=['⬇ 1g','🌙','0g','⬆'];let gi=0;
function GR_upd(){$('#grav').textContent=GL[gi];world.gravity.set(0,GR[gi],0);O.forEach(o=>o.b.wakeUp())}
$('#grav').onclick=()=>{gi=(gi+1)%4;GR_upd()};
const TC={},GC={lamp:0xffdd55,thr:0xff7722,mag:0xff3366},GT=(()=>{const g=document.createElement('canvas');g.width=g.height=64;const x=g.getContext('2d'),r=x.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'#fff');r.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=r;x.fillRect(0,0,64,64);return new THREE.CanvasTexture(g)})();for(const k in TY)if(TY[k].m===undefined)TY[k].m=1;
function tex(l,c){const k=l+c;if(TC[k])return TC[k];const g=document.createElement('canvas');g.width=g.height=64;const x=g.getContext('2d');x.fillStyle='#'+c.toString(16).padStart(6,'0');x.fillRect(0,0,64,64);x.strokeStyle='rgba(0,0,0,.45)';x.lineWidth=4;x.strokeRect(2,2,60,60);x.fillStyle='#fff';x.font='bold 18px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(l,32,34);return TC[k]=new THREE.CanvasTexture(g)}
function spawn(t,p){p={x:Number.isInteger(p.x)?p.x+.5:p.x,y:p.y,z:Number.isInteger(p.z)?p.z+.5:p.z};const d=TY[t];const mats=[0,1,2,3,4,5].map(i=>new THREE.MeshLambertMaterial({map:((t==='sen'||t==='thr')&&i===4)?tex('▶',0xfacc15):tex(d.l,d.c),wireframe:wire}));
const m=new THREE.Mesh(new THREE.BoxGeometry(1,1,1),mats);m.castShadow=m.receiveShadow=true;scene.add(m);const gs=new THREE.Sprite(new THREE.SpriteMaterial({map:GT,color:GC[t]||0x44ff88,blending:THREE.AdditiveBlending,depthWrite:false}));gs.scale.setScalar(3);gs.visible=false;m.add(gs);const ed=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.06,1.06,1.06)),new THREE.LineBasicMaterial({color:0x66ccff}));ed.visible=d.m!==0;m.add(ed);const nb=x=>{const n=new THREE.Mesh(new THREE.SphereGeometry(.13,10,8),new THREE.MeshBasicMaterial({color:0x333344}));n.position.set(x,.5,0);m.add(n);return n},hi=!['block','anchor','sw','btn','clock','sen'].includes(t),ho=!['block','anchor'].includes(t);
const b=new CANNON.Body({mass:0});b.addShape(new CANNON.Box(new CANNON.Vec3(.5,.5,.5)));b.position.set(p.x,p.y,p.z);b.linearDamping=.05;b.angularDamping=.2;world.addBody(b);
const o={t,b,m,mats,s:false,g:gs,ed,act:d.m===0,m0:d.m,ni:hi?nb(-.25):null,no:ho?nb(.25):null};m.userData.o=o;b.uo=o;O.push(o);return o}
function paint(o){let e=o.col!==undefined?o.col:(GC[o.t]||0x33aa55),on=o.s&&o.t!=='block'&&o.t!=='anchor';if(o.t==='led'){const v=o.v||[0,0,0,0,0];e=new THREE.Color(v[0]?1:0,v[1]?1:0,v[2]?1:0).multiplyScalar(v[3]?1:.35).getHex();on=v[0]||v[1]||v[2];o.g.scale.setScalar(v[3]?4:2.2)}o.mats.forEach(x=>x.emissive.setHex(on?e:0));o.g.material.color.setHex(e);o.g.visible=!!on}
function addWire(a,b){const i=W.findIndex(w=>w.a===a&&w.b===b&&(b.t!=='led'||w.p===port));if(i>=0){scene.remove(W[i].l);W.splice(i,1);return}
const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3()]);const l=new THREE.Line(g,new THREE.LineBasicMaterial({color:0x888888}));l.frustumCulled=false;scene.add(l);W.push({a,b,l,p:b.t==='led'?port:0});log('Draht '+a.t+'→'+b.t)}

const c=new CANNON.LockConstraint(a.b,b.b,{maxForce:1e6});c.collideConnected=false;world.addConstraint(c);C.push({a,b,c});if(a.act&&!b.act)wake(b);else if(b.act&&!a.act)wake(a);log('Angeschweißt')}

if(G.o===o)G.o=null;world.removeBody(o.b);scene.remove(o.m);O.splice(O.indexOf(o),1)}
function clearAll(){[...O,...N].forEach(del)}
function unsel(){if(sel)sel.m.scale.setScalar(1);sel=null}
/* Logik */
function sensed(o){const q=o.b.quaternion.inverse();for(const p of [...O,...N,{b:PB}]){if(p===o)continue;if(C.some(c=>(c.a===o&&c.b===p)||(c.a===p&&c.b===o)))continue;
const l=q.vmult(p.b.position.vsub(o.b.position));if(l.z>.4&&l.z<(o.rng||1.2)&&Math.abs(l.x)<.9&&Math.abs(l.y)<.9)return true}return false}
function logic(){const ns=O.map(o=>{let ins=W.filter(w=>w.b===o).map(w=>w.a.s);if(o.fi===1)ins=[true];else if(o.fi===2)ins=[false];o.in=ins.some(x=>x);
switch(o.t){case'sw':return o.s;case'sen':return sensed(o);case'and':return ins.length>0&&ins.every(x=>x);case'or':case'lamp':case'thr':case'mag':return ins.some(x=>x);case'not':case'nor':return!ins.some(x=>x);case'nand':return ins.length>0&&!ins.every(x=>x);case'xor':return ins.filter(x=>x).length%2===1;case'xnor':return ins.length>0&&ins.filter(x=>x).length%2===0;case'clock':return Math.floor(NOW*(o.sp||2))%2===0;case'tff':{const c=ins.some(x=>x);if(c&&!o.pi)o.q=!o.q;o.pi=c;return!!o.q}case'delay':{const h=o.h=o.h||[];h.push(ins.some(x=>x));while(h.length>(o.dl||30)+1)h.shift();return h.length>(o.dl||30)?h.shift():false}case'btn':return NOW<o.u||N.some(p=>!p.dead&&p.b.position.distanceTo(o.b.position)<1.3);case'led':{const v=[0,1,2,3,4].map(i=>W.some(w=>w.b===o&&w.p===i&&w.a.s));o.v=v;if(v[4]&&!o.pe)boom(o.b.position,o);o.pe=v[4];return v[0]||v[1]||v[2]}default:return false}});
O.forEach((o,i)=>{if(o.f===1)ns[i]=true;else if(o.f===2)ns[i]=false});O.forEach((o,i)=>{if(o.s!==ns[i]){o.s=ns[i];paint(o);if(o.t!=='led')log(o.t+(o.s?' AN':' AUS'))}if(o.t==='led')paint(o)})}
/* Eingabe */
let yaw=0,pitch=-.3;camera.position.set(0,3,4);
const K={},rc=new THREE.Raycaster(),G={o:null,d:5};

const KM={w:'w',a:'a',s:'s',d:'d',' ':'u',shift:'x'};
addEventListener('keydown',e=>{if(paused||e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();if(KM[k]){K[KM[k]]=1;e.preventDefault()}if(k==='f')toggleGrab();if(k==='q')throwIt();if(k==='v')setFly(!fly);if(k==='e')selTool(ci()+1);if(k==='c')selTool(ci()-1);if(/^[0-9]$/.test(k))digit(+k)});

function pick(x,y){rc.setFromCamera(new THREE.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1),camera);return rc.intersectObjects([ground,...O.map(o=>o.m),...N.flatMap(n=>n.m.children)])[0]}
function two(o,cb){if(!o||o.npc){unsel();return}if(!sel){sel=o;o.m.scale.setScalar(1.1)}else{if(sel!==o)cb(sel,o);unsel()}}
function act(x,y){if(tool==='gun'){toggleGrab();return}const h=pick(x,y);if(!h)return;const o=h.object.userData.o;
