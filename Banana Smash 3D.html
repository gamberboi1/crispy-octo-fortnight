function compass(){let b=null,bd=1e9;for(const o of bg.children){const d=Math.hypot(o.position.x-pos.x,o.position.z-pos.z);if(d<bd){bd=d;b=o}}if(!b)return'';const rel=Math.atan2(b.position.x-pos.x,b.position.z-pos.z)-(yaw+Math.PI),i=((Math.round(-rel/(Math.PI/4))%8)+8)%8;return ' '+['⬆️','↗️','➡️','↘️','⬇️','↙️','⬅️','↖️'][i]+Math.round(bd)+'m'}
function hudTxt(){const s=specials(),a=s.length?AB.find(a=>a.id==s[cur%s.length]):null;return T('Level ','Level ')+lv+'/'+MAXLV+'  🍌 '+got+'/'+tot+compass()+'  '+'❤️'.repeat(Math.max(0,hp))+(a?'  ['+T(a.d,a.e)+(cd>0?' '+cd.toFixed(1):'')+']':'')}
function showOvOld(k){const o=$('ov');mode=k=='win'?'win':'menu';
 const abil=AB.map(a=>`<span class="ab on">${T(a.d,a.e)}</span>`).join('');
 const maxSel=D.all||S.debug?MAXLV:maxLv;if(lv>maxSel)lv=maxSel;
 o.innerHTML=`<h2>🍌 Banana Smash 3D</h2><p>${k=='win'?(lv>=MAXLV?T('🏆 Alle 160 Level geschafft!','🏆 All 160 levels cleared!'):T('Level '+lv+' geschafft!','Level '+lv+' cleared!')):T('Sammle alle Bananen (gelbe Lichtstrahlen) – auch die vergrabenen! Zerstöre das Gelände mit Schlag und Stampfer.','Collect all bananas (yellow beams), even the buried ones! Smash the terrain with punch and pound.')}</p>
 <p style="display:flex;gap:10px;align-items:center"><button id="lm">−</button><b id="ln">Level ${k=='win'?Math.min(MAXLV,lv+1):lv}</b><button id="lp">+</button></p>
 <p style="display:flex;gap:8px;align-items:center"><b>Seed</b><input type="text" id="seedIn" value="${SEED}" style="flex:1;min-width:0"><button id="rnd">🎲</button></p>
 <p><button class="p" id="go">▶ ${T('Spielen','Play')}</button> <button id="ostn">⚙️</button></p>
 <p>${T('Steuerung: Joystick links, rechts ziehen = Kamera. PC: WASD, Leertaste, J Schlag, K Stampfer, L Spezial, Q wechseln, E nehmen/werfen, F bohren (halten), Maus ziehen.','Controls: joystick left, drag right = camera. PC: WASD, Space, J punch, K pound, L special, Q switch, E take/throw, F drill (hold), drag mouse.')}</p>
 <h3>${T('Fähigkeiten','Abilities')}</h3>${abil}<p style="font-size:.8em;opacity:.7">${T('Der Fortschritt wird nicht gespeichert.','Progress is not saved.')}</p>`;
 o.style.display='block';let sel=k=='win'?Math.min(MAXLV,lv+1):lv;
 const upd=()=>{$('ln').textContent='Level '+sel};
 $('lm').onclick=()=>{sel=Math.max(1,sel-1);upd()};$('lp').onclick=()=>{sel=Math.min(D.all||S.debug?MAXLV:maxLv,sel+1);upd()};
 $('ostn').onclick=openSet;$('rnd').onclick=()=>{$('seedIn').value=Math.random().toString(36).slice(2,8)};
 $('go').onclick=()=>{SEED=($('seedIn').value.trim()||'Banane');o.style.display='none';gen(sel);mode='play';snd(600,.1);if(sel==1)toast(T('Alle Fähigkeiten sind freigeschaltet – Spezial wechselst du mit ↻','All abilities are unlocked – switch special with ↻'),3500)}}
// settings
function applyLang(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=e.dataset.t.split('|')[S.lang=='de'?0:1]);document.querySelectorAll('[data-p]').forEach(e=>e.placeholder=e.dataset.p.split('|')[S.lang=='de'?0:1]);document.documentElement.lang=S.lang;dbgTxt()}
function dbgTxt(){$('dGod').textContent=T('Unverwundbar','Invincible')+(D.god?' ✓':'');$('dSpd').textContent=T('Schneller','Faster')+(D.spd?' ✓':'');$('dFly').textContent=T('Fliegen','Fly')+(D.fly?' ✓':'');$('dWire').textContent='Wireframe'+(S.wire?' ✓':'');$('dAll').textContent=T('Alle Fähigkeiten','All abilities')+(D.all?' ✓':'');$('dRst').textContent=T('Neustart','Restart')}
function apply(){document.documentElement.dataset.theme=S.dark?'dark':'light';cam.fov=S.fov;cam.updateProjectionMatrix();R.setPixelRatio(Math.min(devicePixelRatio,2)*[.5,.75,1][S.q]);resize();mat.wireframe=S.wire;document.documentElement.style.fontSize=[14,17,21][S.fs]+'px';$('dv').style.display=S.debug?'block':'none';$('dbg').style.display=S.debug?'block':'none';applyLang()}
function sync(){$('sDark').checked=S.dark;$('sVol').value=S.vol;$('sMute').checked=S.mute;$('sLang').value=S.lang;$('sFs').value=S.fs;$('sFov').value=S.fov;$('sSens').value=S.sens;$('sQ').value=S.q;$('sInv').checked=S.inv}
function openSet(){sync();$('set').style.display='block';paused=true}
function closeSet(){$('set').style.display='none';paused=false}
$('gear').onclick=openSet;$('close').onclick=closeSet;
const bind=(id,k,f=x=>x,ev='input',prop='value')=>$(id).addEventListener(ev,e=>{S[k]=f($(id)[prop]);apply()});
bind('sDark','dark',x=>x,'change','checked');bind('sVol','vol',Number);bind('sMute','mute',x=>x,'change','checked');bind('sLang','lang',x=>x,'change');bind('sFs','fs',Number);bind('sFov','fov',Number);bind('sSens','sens',Number);bind('sQ','q',Number);bind('sInv','inv',x=>x,'change','checked');
$('codeOk').onclick=()=>{if($('code').value==='IchKaka1234'){S.debug=true;$('codeMsg').textContent=T('Debug-Modus aktiviert','Debug mode activated')}else $('codeMsg').textContent=T('Falscher Code','Wrong code');apply()};
$('dOff').onclick=()=>{S.debug=false;$('codeMsg').textContent='';apply()};
$('dGod').onclick=()=>{D.god=!D.god;dbgTxt()};$('dSpd').onclick=()=>{D.spd=!D.spd;dbgTxt()};$('dFly').onclick=()=>{D.fly=!D.fly;dbgTxt()};$('dWire').onclick=()=>{S.wire=!S.wire;apply()};$('dAll').onclick=()=>{D.all=!D.all;dbgTxt()};$('dRst').onclick=()=>{gen(lv);closeSet()};
$('reset').onclick=()=>{S={...S0};D.god=D.spd=D.fly=D.all=false;sync();apply()};
// input
const keys={};let jv={x:0,y:0};
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=true;if(k==' '){jh=true;jump();e.preventDefault()}if(k=='j')punch();if(k=='k'){ph=true;stomp()}if(k=='l')special();if(k=='e')grab();if(k=='f')dr=true;if(k=='r')slideOn();if(k=='c')rolling=true;if(k=='q')cycle()});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();keys[k]=false;if(k==' ')jh=false;if(k=='k')ph=false;if(k=='f')dr=false;if(k=='c')rolling=false});
const btn=(id,dn,up)=>{$(id).addEventListener('pointerdown',e=>{e.preventDefault();dn()});$(id).addEventListener('pointerup',()=>up&&up());$(id).addEventListener('pointerleave',()=>up&&up())};
btn('bA',()=>{jh=true;jump()},()=>jh=false);btn('bB',punch);btn('bC',()=>{ph=true;stomp()},()=>ph=false);btn('bD',special);btn('bE',cycle);btn('bF',grab);btn('bG',()=>{dr=true},()=>dr=false);btn('bH',slideOn);btn('bJ',()=>{if(sl)slOff();rolling=true},()=>rolling=false);
let jp=null,lp=null,jo=null,lx=0,ly=0;const cv=R.domElement;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);if(e.pointerType!=='mouse'&&e.clientX<innerWidth*.45&&jp===null){jp=e.pointerId;jo={x:e.clientX,y:e.clientY};const s=$('st');s.style.display='block';s.style.left=(jo.x-45)+'px';s.style.top=(jo.y-45)+'px'}else if(lp===null){lp=e.pointerId;lx=e.clientX;ly=e.clientY}});
cv.addEventListener('pointermove',e=>{if(e.pointerId===jp){let dx=e.clientX-jo.x,dy=e.clientY-jo.y;const d=Math.hypot(dx,dy),m=45;if(d>m){dx*=m/d;dy*=m/d}jv.x=dx/m;jv.y=dy/m;$('kn').style.transform=`translate(${dx}px,${dy}px)`}else if(e.pointerId===lp){const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;yaw-=dx*.005*S.sens;pitch=Math.max(-.2,Math.min(1.3,pitch+dy*.005*S.sens*(S.inv?-1:1)))}});
const up=e=>{if(e.pointerId===jp){jp=null;jv={x:0,y:0};$('st').style.display='none';$('kn').style.transform=''}if(e.pointerId===lp)lp=null};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function resize(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',resize);
let last=0,fps=60;
function tick(t){requestAnimationFrame(tick);const dt=Math.min(.05,(t-last)/1000||.016);last=t;fps+=(1/dt-fps)*.1;
 if(mode==='play'&&!paused)update(dt*ts);else if(mode!=='play'){cam.position.set(sp0.x+Math.sin(t/4000)*14,sp0.y+8,sp0.z+Math.cos(t/4000)*14);cam.lookAt(sp0.x,sp0.y+2,sp0.z)}
 $('hud').textContent=mode==='play'?hudTxt():'';$('bF').textContent=held?T('WERFEN','THROW'):T('NEHMEN','TAKE');
 if(S.debug)$('dv').textContent=`FPS ${fps.toFixed(0)}\npos ${pos.x.toFixed(1)} ${pos.y.toFixed(1)} ${pos.z.toFixed(1)}\nvel ${vel.x.toFixed(1)} ${vel.y.toFixed(1)} ${vel.z.toFixed(1)}\ncam ${cam.position.x.toFixed(1)} ${cam.position.y.toFixed(1)} ${cam.position.z.toFixed(1)}\nground ${onG} jumps ${jumps} lv ${lv}`;
 R.render(scene,cam)}
apply();gen(1);showOv('menu');requestAnimationFrame(tick);
</script></body></html>
